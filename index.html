<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Three Hands Co</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <script>
        document.addEventListener('load', function(event) {
            if (event.target instanceof HTMLIFrameElement && event.target.hasAttribute('src')) {
                event.target.dataset.embedLoaded = 'true';
            }
        }, true);
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/hls.js@1.6.16/dist/hls.min.js" integrity="sha384-5E8B0pTlZZJMabWpC0fyYf6OUpe15jJij34BqBAh4NXoHAlLNOjCPRrwtOXOQFAn" crossorigin="anonymous"></script>
    <script src="/assets/itch-embed-colors.js"></script>
    <script type="module">
        // web-haptics 0.0.6 — haptics.lochie.me
        // Android/desktop: imperative trigger via navigator.vibrate() (with PWM intensity).
        // iOS 26.5+: direct-tap native switch overlay — see .haptic-switch CSS and
        // https://github.com/lochie/web-haptics/issues/41 plus
        // https://github.com/m1ckc3s/project-fathom. The switch tick is the only
        // haptic available on this iOS path (no custom waveforms).
        import { WebHaptics } from "https://cdn.jsdelivr.net/npm/web-haptics@0.0.6/dist/index.mjs";
        window.WebHaptics = WebHaptics;
        try { window._webHaptics = new WebHaptics(); } catch (_e) {}
    </script>
    <style>
        /* m3x6 by Daniel Linssen — free with attribution.
           https://managore.itch.io/m3x6 (use size 16, 32, 48, ...) */
        @font-face {
            font-family: 'M3x6';
            src: url('/assets/fonts/m3x6.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            min-height: 100%;
            background: black;
            dynamic-range-limit: no-limit;
        }
        
        body {
            background: black;
            min-height: 100vh;
            min-height: 100lvh;
            overflow-x: hidden;
            font-family: 'M3x6', 'Press Start 2P', cursive;
        }

        #video-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            height: 100lvh;
            z-index: 1;
            opacity: 1;
            transition: opacity 0.5s ease-out;
        }

        #video-container.hidden {
            opacity: 0;
            pointer-events: none;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: black;
        }

        /* Feathered soft edge - vignette into the black page background (no box) */
        #video-container video {
            -webkit-mask-image: radial-gradient(ellipse 115% 115% at 50% 50%, black 0%, black 42%, rgba(0,0,0,0.85) 58%, rgba(0,0,0,0.35) 72%, transparent 88%);
            mask-image: radial-gradient(ellipse 115% 115% at 50% 50%, black 0%, black 42%, rgba(0,0,0,0.85) 58%, rgba(0,0,0,0.35) 72%, transparent 88%);
            -webkit-mask-repeat: no-repeat;
            mask-repeat: no-repeat;
            -webkit-mask-size: 100% 100%;
            mask-size: 100% 100%;
        }

        .header-video,
        .header-low-power-frame {
            display: block;
            width: 400px;
            height: 225px;
            margin-bottom: 40px;
            background: transparent;
            object-fit: contain;
            -webkit-mask-image: radial-gradient(ellipse 110% 110% at 50% 50%, black 0%, black 48%, rgba(0,0,0,0.88) 62%, rgba(0,0,0,0.4) 76%, transparent 92%);
            mask-image: radial-gradient(ellipse 110% 110% at 50% 50%, black 0%, black 48%, rgba(0,0,0,0.88) 62%, rgba(0,0,0,0.4) 76%, transparent 92%);
            -webkit-mask-repeat: no-repeat;
            mask-repeat: no-repeat;
            -webkit-mask-size: 100% 100%;
            mask-size: 100% 100%;
        }

        .header-low-power-frame {
            display: none;
            dynamic-range-limit: no-limit;
        }

        .header-video.ios-low-power-hidden {
            display: none;
        }

        .header-low-power-frame.is-active {
            display: block;
        }

        .trailer-wrap {
            position: relative;
            width: min(646px, calc(100vw - 40px));
            aspect-ratio: 16 / 9;
            /* Neumorphic frame — shadowing matches the LCD module: directional
               key light from the top-left, crisp inset top edge, soft bottom
               shade, near-black hairline. */
            isolation: isolate;
            border: 1px solid #030405;
            border-radius: 20px;
            padding: 8px;
            background: linear-gradient(145deg, #313439 0%, #131519 10%, #0a0b0e 52%, #1c1f24 100%);
            box-shadow:
                11px 13px 24px rgba(0, 0, 0, 0.92),
                -8px -8px 18px rgba(255, 255, 255, 0.07),
                inset 0 1px 0 rgba(255, 255, 255, 0.16),
                inset 0 -2px 3px rgba(0, 0, 0, 0.8);
            dynamic-range-limit: no-limit;
        }

        /* HDR shimmering edge — visible, crawling the border */
        .trailer-wrap::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 20px;
            padding: 2.6px;
            /* STATIC specular parked dead-center top (straight), +2 stops HDR. */
            background: radial-gradient(ellipse 46% 52% at var(--bezel-x, 50%) var(--bezel-y, 8%), color(srgb-linear 190 190 190) 0%, color(srgb-linear 95 95 95) 20%, color(srgb-linear 38 38 38) 42%, transparent 84%);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask-composite: exclude;
            pointer-events: none;
            opacity: var(--bezel-specular, 0.92);
            mix-blend-mode: screen;
            will-change: opacity, background;
        }

        .trailer-wrap::after {
            content: "";
            position: absolute;
            inset: 1px;
            border-radius: 19px;
            /* Top glass band like the LCD shell, plus the diagonal sheen. */
            background:
                linear-gradient(180deg, rgba(255, 255, 255, 0.12), rgba(255, 255, 255, 0.02) 9%, transparent 26%),
                linear-gradient(145deg, rgba(255, 255, 255, 0.10) 0%, transparent 48%);
            pointer-events: none;
            opacity: 0.75;
        }

        .featured-trailer {
            display: block;
            position: relative;
            z-index: 1;
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: black;
            border-radius: 12px;
            overflow: hidden;
            -webkit-mask-image: radial-gradient(ellipse 110% 110% at 50% 50%, black 0%, black 45%, rgba(0,0,0,0.9) 60%, rgba(0,0,0,0.45) 75%, transparent 95%);
            mask-image: radial-gradient(ellipse 110% 110% at 50% 50%, black 0%, black 45%, rgba(0,0,0,0.9) 60%, rgba(0,0,0,0.45) 75%, transparent 95%);
            -webkit-mask-repeat: no-repeat;
            mask-repeat: no-repeat;
            -webkit-mask-size: 100% 100%;
            mask-size: 100% 100%;
        }

        /* Realtime monitor glow: a downsampled copy of the current frame, blurred.
           Painted on three layers - tight bloom + wide spill + outer haze.
           No mask/border — the canvas edge is hidden by blur + dither. */
        .trailer-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            z-index: 0;
            width: 100%;
            height: 100%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            opacity: 0;
            will-change: opacity;
            image-rendering: auto;
            /* 10-bit raster surface on HDR pipelines: blur+saturate are
               computed without 8-bit quantization bands. */
            dynamic-range-limit: no-limit;
        }

        .trailer-glow-tight {
            width: 118%;
            height: 118%;
            filter: blur(56px) saturate(1.5);
        }

        .trailer-glow-wide {
            width: 170%;
            height: 170%;
            filter: blur(130px) saturate(1.5);
        }

        .trailer-glow-outer {
            width: 220%;
            height: 220%;
            filter: blur(190px) saturate(1.5);
        }



        /* Dust motes drifting through the monitor light. Each mote is lit by
           sampling the downsampled frame, so dust only shows where the glow
           actually falls - like dust in a light beam at night. */
        .trailer-dust {
            position: absolute;
            top: 50%;
            left: 50%;
            z-index: 2;
            width: 170%;
            height: 170%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            dynamic-range-limit: no-limit;
        }

        #content-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            height: 100lvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 40px;
            z-index: 0;
            opacity: 0;
            transition: opacity 0.5s ease-in;
            overflow-y: auto;
            /* The glow bleeds past the viewport edges; clip it without creating
               a horizontal scroll container (body overflow-x: hidden is the
               fallback for browsers without `clip`). */
            overflow-x: clip;
            padding: 40px 0;
            /* Keep in-flow content clear of the dynamic Safari controls. */
            padding:
                calc(40px + env(safe-area-inset-top, 0px))
                env(safe-area-inset-right, 0px)
                calc(40px + max(env(safe-area-inset-bottom, 0px), 24px))
                env(safe-area-inset-left, 0px);
        }

        #content-container.visible {
            opacity: 1;
        }

        .buttons-container {
            display: flex;
            width: min(646px, calc(100vw - 40px));
            gap: 40px;
            /* #content-container supplies the shared 40px vertical rhythm. */
            margin-top: 0;
            margin-bottom: 40px;
            flex-wrap: wrap;
            justify-content: center;
        }

        @media (min-width: 1025px) {
            .buttons-container .platform-link {
                /* Make the painted button edges, not just their parent,
                   span the same 646px as the video and LCD. */
                flex: 1 1 0;
                min-width: 0;
            }
        }

        .widgets-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            opacity: 0;
            transition: opacity 0.3s ease;
            max-width: 100%;
            padding: 0 20px;
            margin-bottom: 40px;
        }

        .widgets-container.visible {
            opacity: 1;
        }

        .steam-widgets,
        .itch-widgets {
            display: none;
            flex-direction: column;
            gap: 20px;
        }

        .steam-widgets {
            width: min(646px, calc(100vw - 40px));
        }

        .itch-widgets {
            width: min(646px, calc(100vw - 40px));
        }

        .embed-shell {
            position: relative;
            width: 100%;
            overflow: hidden;
            background: transparent;
            isolation: isolate;
        }

        .steam-widgets .embed-shell {
            max-width: 646px;
            height: 190px;
        }

        .itch-widgets .embed-shell {
            max-width: 646px;
            height: 175px;
        }

        @media (max-width: 600px) {
            .itch-widgets .embed-shell {
                height: 158px;
            }
        }

        .embed-shell iframe {
            position: absolute;
            inset: 0;
            z-index: 2;
            display: block;
            width: 100%;
            height: 100%;
            opacity: 0;
            pointer-events: none;
            transform: scale(0.98);
            will-change: opacity, transform, mask-position;
            /* Diagonal gradient wipe: hidden until the reveal mask sweeps across. */
            -webkit-mask-image: linear-gradient(115deg, transparent 0%, black 28%, black 100%);
            mask-image: linear-gradient(115deg, transparent 0%, black 28%, black 100%);
            -webkit-mask-size: 250% 100%;
            mask-size: 250% 100%;
            -webkit-mask-repeat: no-repeat;
            mask-repeat: no-repeat;
            -webkit-mask-position: -100% 0;
            mask-position: -100% 0;
            transition: opacity 0.2s ease,
                transform 0.65s cubic-bezier(0.22, 1, 0.36, 1),
                -webkit-mask-position 0.65s cubic-bezier(0.22, 1, 0.36, 1),
                mask-position 0.65s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .embed-shell.embed-visible iframe {
            opacity: 1;
            pointer-events: auto;
            transform: scale(1);
            /* End past the ramp so the wipe edge fully leaves the frame. */
            -webkit-mask-position: 50% 0;
            mask-position: 50% 0;
        }

        .embed-loading {
            position: absolute;
            inset: 0;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            color: #b8c0c8;
            background: #000000;
            font-size: 32px;
            letter-spacing: 1px;
            text-align: center;
            transition: opacity 0.35s ease, visibility 0s linear 0.35s;
        }

        .embed-loading::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(110deg, transparent 25%, rgba(255, 255, 255, 0.07) 45%, transparent 65%);
            transform: translateX(-100%);
            animation: embed-loading-sweep 1.8s ease-in-out infinite;
        }

        .embed-loading span {
            position: relative;
            z-index: 1;
            animation: embed-loading-pulse 1.8s ease-in-out infinite;
        }

        .embed-shell.embed-visible .embed-loading {
            visibility: hidden;
            opacity: 0;
        }

        @keyframes embed-loading-sweep {
            to { transform: translateX(100%); }
        }

        @keyframes embed-loading-pulse {
            0%, 100% { opacity: 0.45; }
            50% { opacity: 0.9; }
        }

        .embed-error {
            position: absolute;
            inset: 0;
            z-index: 1;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: #000000;
            color: #b8c0c8;
            font-size: 32px;
            letter-spacing: 1px;
            text-align: center;
            padding: 16px;
        }

        .embed-error span {
            color: #b8c0c8;
        }

        .embed-retry {
            padding: 10px 14px;
            border: 2px solid white;
            background: transparent;
            color: white;
            font-family: 'M3x6', 'Press Start 2P', cursive;
            font-size: 32px;
            letter-spacing: 1px;
            cursor: pointer;
            transition: background 0.2s ease, color 0.2s ease;
        }

        .embed-retry:hover {
            background: white;
            color: black;
        }

        .embed-error a.embed-fallback-link {
            color: #b8c0c8;
            font-size: 32px;
            letter-spacing: 1px;
            text-decoration: underline;
            text-underline-offset: 3px;
        }

        .embed-error a.embed-fallback-link:hover {
            color: white;
        }

        .embed-shell.embed-failed .embed-error {
            display: flex;
        }

        .embed-shell.embed-failed .embed-loading {
            visibility: hidden;
            opacity: 0;
        }

        .embed-shell.embed-failed .embed-cursor-overlay {
            display: none !important;
            pointer-events: none;
        }

        .steam-widgets.visible,
        .itch-widgets.visible {
            display: flex;
        }

        @media (prefers-reduced-motion: reduce) {
            .embed-shell iframe {
                transform: none;
                -webkit-mask-position: 50% 0;
                mask-position: 50% 0;
                transition: opacity 0.25s ease;
            }

            .embed-loading {
                transition-duration: 0.01ms;
            }

            .embed-loading::before,
            .embed-loading span {
                animation: none;
            }
        }

        /* Neumorphic — soft UI: same hue as the page, depth from paired
           dark/light shadows. Feels pressed from the black, not floating
           on it. Keeps the pixel font but makes the surface tactile. */
        .platform-link {
            color: #6e7680;
            text-decoration: none;
            background: #0a0a0a;
            background-image:
                radial-gradient(ellipse 85% 58% at 50% 22%, rgba(255,255,255,0.022) 0%, transparent 62%),
                linear-gradient(180deg, rgba(255,255,255,0.018) 0%, transparent 18%, transparent 84%, rgba(0,0,0,0.08) 100%);
            border: none;
            border-radius: 12px;
            height: clamp(72px, 9vw, 84px);
            padding: 0 26px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            line-height: 1;
            text-align: center;
            min-width: 180px;
            text-transform: uppercase;
            letter-spacing: 1.6px;
            image-rendering: auto;
            position: relative;
            cursor: pointer;
            font-family: 'M3x6', 'Press Start 2P', cursive;
            text-shadow: 0 0 1px rgba(255, 240, 210, 0.16), 0 0 2.5px rgba(255, 220, 180, 0.08);
            -webkit-text-fill-color: initial;
            -webkit-text-fill-color: initial;
            opacity: 1;
            filter: blur(0.32px) contrast(1.9) brightness(1) sepia(0);
            /* cheap office keycap — subtle dish + beveled rim, top-heavy glow */
            box-shadow:
                0 0 18px var(--btn-glow, rgba(38, 130, 235, 0.06)),
                9px 9px 16px rgba(0, 0, 0, 0.88),
                -9px -9px 16px var(--btn-edge, rgba(125, 175, 255, 0.11)),
                inset 0 1px 0 rgba(130, 180, 255, 0.07),
                inset 0 1.5px 2px rgba(255,255,255,0.035),
                inset 0 -2px 3px rgba(0,0,0,0.60),
                inset 0 -4px 8px rgba(0,0,0,0.36),
                inset 1px 1px 1.5px rgba(255,255,255,0.025);
            -webkit-tap-highlight-color: transparent;
            transition:
                box-shadow 0.22s cubic-bezier(0.2, 0.8, 0.2, 1),
                transform 0.22s cubic-bezier(0.2, 0.8, 0.2, 1),
                filter 0.2s ease;
            dynamic-range-limit: no-limit;
        }

        /* per-button decal jitter — not distracting, just not laser-perfect */
        .platform-link:nth-child(1) { --rot: -0.14deg; letter-spacing: 1.55px; }
        .platform-link:nth-child(2) { --rot: 0.11deg; letter-spacing: 1.68px; }
        .platform-link:nth-child(3) { --rot: -0.07deg; letter-spacing: 1.58px; }
        .platform-link { transform: rotate(var(--rot, 0deg)); }

        /* popped-out specular — brighter HDR, 1-2px at true peak, video-driven.
           The full gradient is swapped per button so the shimmer carries the
           color of the frame region above that button. */
        .platform-link::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 12px;
            padding: 3.4px;
            background: var(--btn-spec-bg, radial-gradient(ellipse 34% 42% at var(--btn-spec-x, 22%) var(--btn-spec-y, 20%), color(srgb-linear 6 6 6) 0%, color(srgb-linear 2.6 2.6 2.6) 18%, color(srgb-linear 1.1 1.1 1.1) 32%, transparent 62%)),
                linear-gradient(180deg, rgba(255,255,255,0.14) 0%, rgba(255,255,255,0.06) 18%, transparent 42%, rgba(0,0,0,0.10) 100%);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask-composite: exclude;
            pointer-events: none;
            opacity: var(--btn-specular, 0);
            mix-blend-mode: screen;
            will-change: opacity;
        }
        .platform-link.active::before,
        .platform-link:active::before {
            opacity: 0.12 !important;
        }

        /* real-button age: ultra-subtle grain + decal misregister, not distracting */
        .platform-link::after {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 12px;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.92' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.045'/%3E%3C/svg%3E");
            opacity: 0.38;
            mix-blend-mode: overlay;
            pointer-events: none;
        }

        .platform-link:hover {
            transform: rotate(var(--rot, 0deg)) translateY(-2px);
            text-shadow: 0 0 1px rgba(255, 240, 210, 0.16), 0 0 2.5px rgba(255, 220, 180, 0.08);
            box-shadow:
                0 0 20px var(--btn-glow, rgba(38, 130, 235, 0.06)),
                11px 11px 22px rgba(0, 0, 0, 0.96),
                -11px -11px 22px var(--btn-edge, rgba(125, 175, 255, 0.12)),
                inset 0 1px 0 rgba(130, 180, 255, 0.09),
                inset 0 -1px 1px rgba(0, 0, 0, 0.6);
        }

        .platform-link:active,
        .platform-link.active {
            background-color: #0a0a0a;
            background-image:
                linear-gradient(90deg,
                    color(srgb-linear 32 2 18) 0%, color(srgb-linear 32 2 18) 14%, color(srgb-linear 2 65 2) 36%, color(srgb-linear 2 2 65) 64%, color(srgb-linear 32 2 18) 86%, color(srgb-linear 32 2 18) 100%),
                radial-gradient(ellipse 85% 58% at 50% 22%, rgba(255,255,255,0.022) 0%, transparent 62%),
                linear-gradient(180deg, rgba(255,255,255,0.018) 0%, transparent 18%, transparent 84%, rgba(0,0,0,0.08) 100%);
            background-size: 200% 100%, auto, auto;
            background-clip: text, border-box, border-box;
            -webkit-background-clip: text, border-box, border-box;
            -webkit-text-fill-color: transparent;
            color: transparent;
            /* subtle glow that match color but raise whites */
            text-shadow: 0 0 1px rgba(255, 240, 210, 0.16), 0 0 2.5px rgba(255, 220, 180, 0.08);
            opacity: 1;
            filter: brightness(1) contrast(1);
            animation: rgb-shift 0.5s linear infinite;
            /* pressed — whisper of rim, more subtle */
            box-shadow:
                0 0 0 1px rgba(255,255,255,0.06),
                inset 8px 8px 16px rgba(0, 0, 0, 0.96),
                inset -8px -8px 16px rgba(255, 255, 255, 0.045);
            transform: rotate(var(--rot, 0deg)) translateY(1px) scale(0.993);
        }

        @keyframes rgb-shift {
            0% { background-position: 0% 0%, 0% 0%, 0% 0%; }
            100% { background-position: 200% 0%, 0% 0%, 0% 0%; }
        }

        /* After 0.5s the rainbow settles to static HDR white — smooth cross-fade */
        .platform-link.active.settled {
            background-image:
                linear-gradient(90deg,
                    color(srgb-linear 12 12 12) 0%, color(srgb-linear 12 12 12) 100%),
                radial-gradient(ellipse 85% 58% at 50% 22%, rgba(255,255,255,0.022) 0%, transparent 62%),
                linear-gradient(180deg, rgba(255,255,255,0.018) 0%, transparent 18%, transparent 84%, rgba(0,0,0,0.08) 100%);
            animation: none;
            transition: background-image 0.33s cubic-bezier(0.4, 0, 0.2, 1), filter 0.33s ease;
        }

        .platform-link:focus-visible {
            outline: none;
            box-shadow:
                9px 9px 18px rgba(0, 0, 0, 0.92),
                -9px -9px 18px rgba(255, 255, 255, 0.055),
                0 0 0 2px rgba(255,255,255,0.14);
        }

        .platform-link:disabled {
            color: #6e7680;
            background: #0a0a0a;

        /* Web Haptics — iOS 26.5+ direct-tap fix (issue #41).
           See https://github.com/lochie/web-haptics/issues/41 and
           https://github.com/m1ckc3s/project-fathom for the native
           switch overlay pattern. The visible button is decoration;
           the transparent native switch underneath is the real tap
           target so iOS plays its system tick on a direct finger tap.
           Android and other browsers use navigator.vibrate() via
           web-haptics imperatively. clip-path rounds the *hit* area,
           not just paint — overflow+radius leaves dead corners. */
        .haptic-wrap {
            position: relative;
            display: inline-flex;
        }

        .haptic-wrap .platform-link {
            width: 100%;
            flex: 1 1 0;

        @media (min-width: 1025px) {

        @media (max-width: 1024px), (hover: none) and (pointer: coarse) {

        .haptic-switch {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            margin: 0;
            opacity: 0;

            clip-path: inset(0 round 12px);
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            z-index: 5;
        }

        .haptic-wrap:has(.platform-link:disabled) .haptic-switch {
            cursor: not-allowed;

           The switch sits inside .lcd-screen (which is already position:relative)
           and covers the blue display. It is clipped to the screen's 12px radius
           and sits above .lcd-hitarea (z-index:4) so the direct tap hits the
           native switch. z-index 5 ensures the switch is the top hit target. */
        .lcd-screen .haptic-switch {
            clip-path: inset(0 round 12px);
            z-index: 5;

        /* Adafruit-style 16x2 LCD module: black plastic shell around a

         .lcd-module {

            overflow: hidden;
            isolation: isolate;

            border-radius: 20px;

            box-shadow:
                11px 13px 24px rgba(0, 0, 0, 0.92),

                inset 0 1px 0 rgba(255, 255, 255, 0.16),
                inset 0 -2px 3px rgba(0, 0, 0, 0.8);

            cursor: pointer;
        }

        .lcd-module:focus-visible {
            outline: 2px solid rgba(100, 180, 255, 0.6);
            outline-offset: 2px;
        }

        .lcd-module::before {
            content: "";
            position: absolute;
            top: 2px;
            right: 6px;
            left: 6px;
            height: 2px;
            border-radius: 999px;
            background: linear-gradient(180deg, rgba(255,255,255,0.22), rgba(255,255,255,0.02));
            opacity: 0.275;
            pointer-events: none;
        }

        /* Dynamic specular ring on the LCD shell. The screen sits ABOVE, so its
           light falls DOWN onto the shell's top edge: the reflection is a
           horizontal band along the TOP border, brightest directly under the
           video's hot spot and fading toward the sides. JS drives only the
           horizontal position + intensity. */
        .lcd-spec-ring {
            position: absolute;
            inset: 0;
            z-index: 2;
            border-radius: 20px;
            padding: 2px;
            /* Full-width baseline: the screen above lights the ENTIRE top
               edge; the moving hotspot rides on top of it. */
            background:
                linear-gradient(180deg, color(srgb-linear 3.5 3.5 3.5) 0%, color(srgb-linear 1 1 1) 50%, transparent 96%),
                radial-gradient(ellipse 64% 26% at var(--lcd-spec-x, 50%) var(--lcd-spec-y, 9%), color(srgb-linear 13 13 13) 0%, color(srgb-linear 8 8 8) 22%, color(srgb-linear 3.5 3.5 3.5) 46%, transparent 74%);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask-composite: exclude;
            pointer-events: none;
            opacity: var(--lcd-specular, 0.275);
            mix-blend-mode: screen;
            will-change: opacity, background;
            dynamic-range-limit: no-limit;

                padding: 0;
                border: 2px solid transparent;
                background:
                    linear-gradient(180deg, color(srgb-linear 3.5 3.5 3.5) 0%, color(srgb-linear 1 1 1) 50%, transparent 96%),
                    radial-gradient(ellipse 64% 26% at var(--lcd-spec-x, 50%) var(--lcd-spec-y, 9%), color(srgb-linear 13 13 13) 0%, color(srgb-linear 8 8 8) 22%, color(srgb-linear 3.5 3.5 3.5) 46%, transparent 74%) border-box;
                -webkit-mask: none;
                mask: none;
                background-clip: border-box;
            }

        // LCD backlight: tap cycles blue -> green -> red -> blue, holistically.
        // Real 32x2 char LCD has RC lag and a faint flicker as the
        // backlight driver switches — dim, swap, then bloom back in.
        (function() {
            const lcdModuleEl = document.querySelector('.lcd-module');
            if (!lcdModuleEl) return;

        function renderLcdDisplay() {
            const screen = document.querySelector('.lcd-screen');
            const canvas = document.querySelector('.lcd-matrix');
            const module = document.querySelector('.lcd-module');
            const srText = document.querySelector('.lcd-sr-text');
            if (!screen || !canvas || !module) return;

            const ctx = canvas.getContext('2d', { alpha: true });
            const reducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            let cssWidth = 0;
            let cssHeight = 0;
            let deviceScale = 1;
            let dot = 3;
            let rowHeight = 0;
            let rowGap = 0;
            let left = 0;
            let top = 0;
            let currentTop = '';
            let currentBottom = '';
            let stripCanvas = null;
            let stripCtx = null;
            let stripColumns = 0;
            let messageIndex = 0;
            let phase = 'hold';
            let position = LCD_COLUMNS;
            let exitPosition = LCD_COLUMNS;
            let phaseUntil = performance.now() + 2400;
            let tickerTimer = null;

            function glyphFor(character) {
                return LCD_GLYPHS[character] || LCD_GLYPHS[character.toUpperCase()] || LCD_GLYPHS['?'];
            }

            function resizeCanvas() {
                cssWidth = screen.clientWidth;
                cssHeight = screen.clientHeight;
                deviceScale = Math.min(window.devicePixelRatio || 1, 2);
                canvas.width = Math.max(1, Math.round(cssWidth * deviceScale));
                canvas.height = Math.max(1, Math.round(cssHeight * deviceScale));
                canvas.style.width = cssWidth + 'px';
                canvas.style.height = cssHeight + 'px';
                ctx.setTransform(deviceScale, 0, 0, deviceScale, 0, 0);
                ctx.imageSmoothingEnabled = false;

                const available = Math.max(1, cssWidth - 28);
                // 32 fixed character columns, each made from a 5x8 dot cell.
                dot = Math.max(1.35, Math.min(7.5, available / (LCD_COLUMNS * 6.35)));
                rowHeight = dot * (8 + 7 * 0.12);
                rowGap = dot * 2.1;
                left = (cssWidth - dot * 6.35 * LCD_COLUMNS) / 2;
                top = (cssHeight - (rowHeight * 2 + rowGap)) / 2;
                screen.style.setProperty('--lcd-dot', dot.toFixed(2) + 'px');
                rebuildStrip();
                drawMatrix(position);
            }

            function rebuildStrip() {
                if (!cssWidth || !cssHeight || !currentTop || !currentBottom) return;
                // Add a full blank viewport after the track so the text can
                // leave cleanly without sampling beyond the offscreen bitmap.
                stripColumns = Math.max(currentTop.length, currentBottom.length) + LCD_COLUMNS;
                stripCanvas = document.createElement('canvas');
                stripCanvas.width = Math.max(1, Math.ceil((left + dot * 6.35 * stripColumns) * deviceScale));
                stripCanvas.height = Math.max(1, Math.round(cssHeight * deviceScale));
                stripCtx = stripCanvas.getContext('2d', { alpha: true });
                stripCtx.setTransform(deviceScale, 0, 0, deviceScale, 0, 0);
                stripCtx.imageSmoothingEnabled = false;
                const pixelStep = dot * 1.12;
                const cellPitch = dot * 6.35;

                [currentTop, currentBottom].forEach(function(text, rowIndex) {
                    const characters = Array.from(text.padEnd(stripColumns, ' ').slice(0, stripColumns));
                    const yBase = top + rowIndex * (rowHeight + rowGap);
                    characters.forEach(function(character, column) {
                        const glyph = glyphFor(character).join('');
                        const xBase = left + column * cellPitch;
                        for (let pixelIndex = 0; pixelIndex < glyph.length; pixelIndex++) {
                            const pixelX = pixelIndex % 5;
                            const pixelY = Math.floor(pixelIndex / 5);
                            const x = xBase + pixelX * pixelStep;
                            const y = yBase + pixelY * pixelStep;
                            stripCtx.fillStyle = glyph[pixelIndex] === '1'
                                ? (rowIndex === 0 ? 'rgba(210,235,255,0.94)' : 'rgba(201,229,255,0.88)')
                                : 'rgba(134,197,255,0.23)';
                            stripCtx.fillRect(x, y, dot, dot);
                        }
                    });
                });
            }

            function drawMatrix(scrollPosition) {
                if (!cssWidth || !cssHeight || !stripCanvas || !stripCtx) return;
                ctx.clearRect(0, 0, cssWidth, cssHeight);
                const sourceX = Math.round(scrollPosition * dot * 6.35 * deviceScale);
                ctx.drawImage(
                    stripCanvas,
                    sourceX,
                    0,
                    Math.round(cssWidth * deviceScale),
                    Math.round(cssHeight * deviceScale),
                    0,
                    0,
                    cssWidth,
                    cssHeight
                );
            }

            function updateAccessibleText(message) {
                module.setAttribute('aria-label', `${message.top}. ${message.bottom}.`);
                if (srText) srText.textContent = message.bottom;
            }

            resizeCanvas();
            if (window.ResizeObserver) new ResizeObserver(resizeCanvas).observe(screen);
            window.addEventListener('resize', resizeCanvas, { passive: true });

            function loadMessage(index, immediate) {
                messageIndex = index % LCD_TICKER_MESSAGES.length;
                const message = LCD_TICKER_MESSAGES[messageIndex];
                currentTop = ' '.repeat(LCD_COLUMNS) + message.top + '    ';
                currentBottom = ' '.repeat(LCD_COLUMNS) + message.bottom + '    ';
                exitPosition = Math.max(currentTop.length, currentBottom.length);
                position = immediate ? LCD_COLUMNS : 0;
                phase = immediate ? 'hold' : 'in';
                phaseUntil = performance.now() + (immediate ? 2400 : 0);
                updateAccessibleText(message);
                rebuildStrip();
                drawMatrix(position);
            }

            function tickTicker() {
                if (!document.hidden && !reducedMotion) {
                    const now = performance.now();
                    if (phase === 'hold' && now >= phaseUntil) phase = 'out';
                    if (phase === 'in') {
                        position += 1;
                        if (position >= LCD_COLUMNS) {
                            position = LCD_COLUMNS;
                            phase = 'hold';
                            phaseUntil = now + 2200;
                        }
                    } else if (phase === 'out') {
                        position += 1;
                        if (position >= exitPosition) loadMessage(messageIndex + 1, false);
                    }
                    drawMatrix(position);
                }
                tickerTimer = window.setTimeout(tickTicker, document.hidden ? 500 : 105);
            }

            loadMessage(0, true);
            if (!reducedMotion) tickerTimer = window.setTimeout(tickTicker, 105);
        }

        renderLcdDisplay();

        function clearEmbedTimeout(frame) {
            if (frame._embedTimeout) {
                clearTimeout(frame._embedTimeout);
                frame._embedTimeout = null;
            }
        }

        function scheduleEmbedTimeout(frame, shell) {
            clearEmbedTimeout(frame);
            frame._embedTimeout = window.setTimeout(function() {
                if (shell.classList.contains('embed-ready') || shell.classList.contains('embed-failed')) return;
                if (!frame.hasAttribute('src')) return;
                handleEmbedStalled(frame, shell);
            }, EMBED_LOAD_TIMEOUT_MS);
        }

        function isItchFrame(frame) {
            return !!frame.closest('.itch-widgets');
        }

        function processItchQueue() {
            if (itchQueue.length === 0) return;
            if (itchActiveCount >= ITCH_MAX_CONCURRENT) return;
            if (Date.now() < itch429PauseUntil) {
                var wait = itch429PauseUntil - Date.now();
                if (!itchQueueTimer) {
                    itchQueueTimer = window.setTimeout(function() {
                        itchQueueTimer = null;
                        processItchQueue();
                    }, wait);
                }
                return;
            }
            var now = Date.now();
            var last = processItchQueue._last || 0;
            var delay = Math.max(0, ITCH_THROTTLE_MS - (now - last));
            if (delay > 0) {
                if (!itchQueueTimer) {
                    itchQueueTimer = window.setTimeout(function() {
                        itchQueueTimer = null;
                        processItchQueue();
                    }, delay);
                }
                return;
            }
            var frame = itchQueue.shift();
            if (!frame || frame.hasAttribute('src') || !frame.dataset.src) {
                window.setTimeout(processItchQueue, 0);
                return;
            }
            var shell = frame.closest('.embed-shell');
            if (!shell || shell.classList.contains('embed-ready') || (shell.classList.contains('embed-failed') && parseInt(frame.dataset.embedRetry || '0', 10) >= EMBED_MAX_RETRIES)) {
                window.setTimeout(processItchQueue, 0);
                return;
            }
            itchActiveCount++;
            processItchQueue._last = Date.now();
            shell.classList.remove('embed-failed');
            try { frame.loading = 'eager'; } catch (_e) {}
            frame.src = frame.dataset.src;
            shell.dataset.embedState = 'loading';
            scheduleEmbedTimeout(frame, shell);
            var onDone = function() {
                itchActiveCount = Math.max(0, itchActiveCount - 1);
                frame.removeEventListener('load', onDone);
                frame.removeEventListener('error', onDone);
                window.setTimeout(processItchQueue, ITCH_THROTTLE_MS);
            };
            frame.addEventListener('load', onDone);
            frame.addEventListener('error', onDone);
            if (itchQueue.length) {
                window.setTimeout(processItchQueue, ITCH_THROTTLE_MS);
            }
        }

        function enqueueItchLoad(frame) {
            if (!frame.dataset.src || frame.hasAttribute('src')) return;
            if (itchQueue.indexOf(frame) !== -1) return;
            var shell = frame.closest('.embed-shell');
            if (!shell || shell.classList.contains('embed-ready')) return;
            if (shell.classList.contains('embed-failed') && parseInt(frame.dataset.embedRetry || '0', 10) >= EMBED_MAX_RETRIES) return;
            itchQueue.push(frame);
            processItchQueue();
        }

        function handleEmbedStalled(frame, shell) {
            var retries = parseInt(frame.dataset.embedRetry || '0', 10);
            var isItch = isItchFrame(frame);
            // Itch 429 — exponential backoff with jitter, and global pause
            var backoff = isItch ? (ITCH_BACKOFF_BASE_MS * Math.pow(2, retries) + Math.random() * 700) : (400 * (retries + 1));
            if (isItch) { itch429PauseUntil = Date.now() + backoff + 800; }
            if (retries < EMBED_MAX_RETRIES) {
                frame.dataset.embedRetry = String(retries + 1);
                var source = frame.dataset.src || frame.getAttribute('src');
                if (!source) {
                    markEmbedFailed(shell, frame);
                    if (isItch) { itchActiveCount = Math.max(0, itchActiveCount - 1); window.setTimeout(processItchQueue, ITCH_THROTTLE_MS); }
                    return;
                }
                frame.dataset.src = source;
                frame.removeAttribute('src');
                shell.classList.remove('embed-ready');
                // For itch, re-queue with backoff; for others immediate
                if (isItch) {
                    itchActiveCount = Math.max(0, itchActiveCount - 1);
                    window.setTimeout(function() {
                        enqueueItchLoad(frame);
                    }, backoff);
                    window.setTimeout(processItchQueue, backoff);
                } else {
                    window.setTimeout(function() {
                        startEmbedLoad(frame);
                    }, backoff);
                }
            } else {
                markEmbedFailed(shell, frame);
                if (isItch) { itchActiveCount = Math.max(0, itchActiveCount - 1); window.setTimeout(processItchQueue, ITCH_THROTTLE_MS); }
            }
        }

        function markEmbedReady(shell, frame, index) {
            clearEmbedTimeout(frame);
            shell.classList.remove('embed-failed');
            if (shell.classList.contains('embed-ready')) return;
            shell.classList.add('embed-ready');
            frame.removeAttribute('tabindex');
            const group = shell.closest('.steam-widgets, .itch-widgets');
            if (group && group.classList.contains('visible')) {
                window.setTimeout(function() {
                    if (group.classList.contains('visible') && shell.classList.contains('embed-ready')) {
                        shell.classList.add('embed-visible');
                    }
                }, Math.min(index, 5) * 80);
            }
        }

        function markEmbedFailed(shell, frame) {
            clearEmbedTimeout(frame);
            shell.classList.remove('embed-ready');
            shell.classList.add('embed-failed');
            shell.classList.remove('embed-visible');
            frame.setAttribute('tabindex', '-1');
        }

        function startEmbedLoad(frame) {
            if (frame.hasAttribute('src')) return;
            if (!frame.dataset.src) return;
            const shell = frame.closest('.embed-shell');
