<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three Hands Co</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <script>
        document.addEventListener('load', function(event) {
            if (event.target instanceof HTMLIFrameElement && event.target.hasAttribute('src')) {
                event.target.dataset.embedLoaded = 'true';
            }
        }, true);
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/hls.js@1.6.16/dist/hls.min.js" integrity="sha384-5E8B0pTlZZJMabWpC0fyYf6OUpe15jJij34BqBAh4NXoHAlLNOjCPRrwtOXOQFAn" crossorigin="anonymous"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: black;
            min-height: 100vh;
            overflow-x: hidden;
            font-family: 'Press Start 2P', cursive;
        }

        #video-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            z-index: 1;
            opacity: 1;
            transition: opacity 0.5s ease-out;
        }

        #video-container.hidden {
            opacity: 0;
            pointer-events: none;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: black;
        }

        .header-video {
            width: 400px;
            height: 225px;
            margin-bottom: 40px;
            background: black;
        }

        .featured-trailer {
            width: min(646px, calc(100vw - 40px));
            height: auto;
            aspect-ratio: 16 / 9;
            object-fit: contain;
            background: black;
        }

        #content-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 40px;
            z-index: 0;
            opacity: 0;
            transition: opacity 0.5s ease-in;
            overflow-y: auto;
            padding: 40px 0;
        }

        #content-container.visible {
            opacity: 1;
        }

        .buttons-container {
            display: flex;
            gap: 40px;
            margin-top: 48px;
            margin-bottom: 40px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .widgets-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            opacity: 0;
            transition: opacity 0.5s ease;
            max-width: 100%;
            padding: 0 20px;
            margin-bottom: 40px;
        }

        .widgets-container.visible {
            opacity: 1;
        }

        .steam-widgets,
        .itch-widgets {
            display: none;
            flex-direction: column;
            gap: 20px;
        }

        .steam-widgets {
            width: min(646px, calc(100vw - 40px));
        }

        .itch-widgets {
            width: min(560px, calc(100vw - 40px));
        }

        .embed-shell {
            position: relative;
            width: 100%;
            overflow: hidden;
            background: #050505;
            isolation: isolate;
        }

        .steam-widgets .embed-shell {
            max-width: 646px;
            height: 190px;
        }

        .itch-widgets .embed-shell {
            max-width: 560px;
            height: 175px;
        }

        .embed-shell iframe {
            position: absolute;
            inset: 0;
            z-index: 2;
            display: block;
            width: 100%;
            height: 100%;
            opacity: 0;
            pointer-events: none;
            transform: translateY(10px);
            transition: opacity 0.45s ease, transform 0.45s ease;
        }

        .embed-shell.embed-visible iframe {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0);
        }

        .embed-loading {
            position: absolute;
            inset: 0;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            color: #b8c0c8;
            background: #050505;
            font-size: 9px;
            letter-spacing: 1px;
            text-align: center;
            transition: opacity 0.35s ease, visibility 0s linear 0.35s;
        }

        .embed-loading::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(110deg, transparent 25%, rgba(255, 255, 255, 0.07) 45%, transparent 65%);
            transform: translateX(-100%);
            animation: embed-loading-sweep 1.8s ease-in-out infinite;
        }

        .embed-loading span {
            position: relative;
            z-index: 1;
            animation: embed-loading-pulse 1.8s ease-in-out infinite;
        }

        .embed-shell.embed-visible .embed-loading {
            visibility: hidden;
            opacity: 0;
        }

        @keyframes embed-loading-sweep {
            to { transform: translateX(100%); }
        }

        @keyframes embed-loading-pulse {
            0%, 100% { opacity: 0.45; }
            50% { opacity: 0.9; }
        }

        .steam-widgets.visible,
        .itch-widgets.visible {
            display: flex;
        }

        @media (prefers-reduced-motion: reduce) {
            .embed-shell iframe,
            .embed-loading {
                transition-duration: 0.01ms;
            }

            .embed-loading::before,
            .embed-loading span {
                animation: none;
            }
        }

        .platform-link {
            color: white;
            text-decoration: none;
            background: transparent;
            border: 3px solid white;
            padding: 20px;
            font-size: 16px;
            transition: all 0.3s ease;
            text-align: center;
            min-width: 180px;
            text-transform: uppercase;
            letter-spacing: 2px;
            image-rendering: pixelated;
            position: relative;
            cursor: pointer;
            font-family: 'Press Start 2P', cursive;
        }

        .platform-link.active {
            background: white;
            color: black;
        }

        .platform-link::before {
            content: '';
            position: absolute;
            top: -5px;
            left: -5px;
            right: -5px;
            bottom: -5px;
            border: 2px solid white;
            opacity: 0;
            transition: all 0.3s ease;
        }

        .platform-link:hover::before {
            opacity: 1;
            animation: glow 1.5s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from {
                box-shadow: 0 0 5px rgba(255, 255, 255, 0.5),
                           0 0 10px rgba(255, 255, 255, 0.3);
            }
            to {
                box-shadow: 0 0 8px rgba(255, 255, 255, 0.6),
                           0 0 15px rgba(255, 255, 255, 0.4);
            }
        }

        .platform-link:hover {
            background: white;
            color: black;
            transform: translateY(-5px);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.7);
        }

        .blurb {
            text-align: center;
            color: white;
            font-family: 'Press Start 2P', cursive;
            font-size: 18px;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
            animation: pulse 2s ease-in-out infinite;
            margin-bottom: 40px;
            text-decoration: none;
            display: block;
            transition: all 0.3s ease;
        }
        
        .blurb:hover {
            transform: scale(1.1);
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.8);
        }

        .release-status {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .release-status .blurb {
            margin-bottom: 0;
        }

        .coming-soon {
            color: #b8c0c8;
            font-family: 'Press Start 2P', cursive;
            font-size: 11px;
            letter-spacing: 1px;
            text-align: center;
            text-shadow: 0 0 8px rgba(184, 192, 200, 0.5);
        }

        @keyframes pulse {
            0% { opacity: 0.7; }
            50% { opacity: 1; }
            100% { opacity: 0.7; }
        }

        .site-footer {
            padding: 20px 20px 40px;
            text-align: center;
        }

        .site-footer a {
            color: #b8c0c8;
            font-family: 'Press Start 2P', cursive;
            font-size: 10px;
            letter-spacing: 1px;
            text-decoration: none;
            text-transform: lowercase;
            transition: color 0.3s ease, text-shadow 0.3s ease;
        }

        .site-footer a:hover {
            color: white;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.7);
        }

        @media (max-width: 768px) {
            html,
            body {
                min-height: 100%;
            }

            body {
                overflow-y: hidden;
            }

            body.content-visible {
                overflow-y: auto;
                -webkit-overflow-scrolling: touch;
            }

            #content-container {
                position: relative;
                top: auto;
                left: auto;
                min-height: 100vh;
                min-height: 100svh;
                height: auto;
                overflow-y: visible;
                touch-action: pan-y;
            }

            .header-video {
                width: calc(100vw - 40px);
                height: auto;
                aspect-ratio: 16 / 9;
            }

            .buttons-container {
                flex-direction: column;
                gap: 30px;
            }

            .platform-link {
                font-size: 14px;
                padding: 15px;
                min-width: 160px;
            }

            .widgets-container {
                width: 100%;
                transform: none;
            }

            .steam-widgets,
            .itch-widgets {
                width: 100%;
                align-items: center;
            }

            .steam-widgets iframe,
            .itch-widgets iframe {
                width: 100%;
            }

            .steam-widgets iframe {
                max-width: 646px;
            }

            .itch-widgets iframe {
                max-width: 560px;
            }
        }
    </style>
</head>

    <script>
        const widgetGroups = Array.from(document.querySelectorAll('.steam-widgets, .itch-widgets'));

        function startEmbedLoad(frame) {
            if (!frame.hasAttribute('src') && frame.dataset.src) {
                frame.src = frame.dataset.src;
            }
        }

        const embedLoadObserver = 'IntersectionObserver' in window
            ? new IntersectionObserver(function(entries, observer) {
                entries.forEach(function(entry) {
                    if (!entry.isIntersecting) return;
                    const frame = entry.target.querySelector('iframe[data-src]');
                    if (frame) startEmbedLoad(frame);
                    observer.unobserve(entry.target);
                });
            }, { rootMargin: '600px 0px' })
            : null;

        function observeLazyEmbeds(group) {
            group.querySelectorAll('iframe[data-src]:not([src])').forEach(function(frame) {
                if (embedLoadObserver) {
                    embedLoadObserver.observe(frame.closest('.embed-shell'));
                } else {
                    startEmbedLoad(frame);
                }
            });
        }

        function revealReadyEmbeds(group) {
            const readyShells = Array.from(group.querySelectorAll('.embed-shell.embed-ready'));

            readyShells.forEach(function(shell, index) {
                window.setTimeout(function() {
                    if (group.classList.contains('visible') && shell.classList.contains('embed-ready')) {
                        shell.classList.add('embed-visible');
                    }
                }, Math.min(index, 5) * 80);
            });
        }

        widgetGroups.forEach(function(group) {
            const provider = group.classList.contains('steam-widgets') ? 'Steam' : 'itch.io';

            Array.from(group.querySelectorAll('iframe')).forEach(function(frame, index) {
                const shell = document.createElement('div');
                const loader = document.createElement('div');
                const loaderText = document.createElement('span');

                shell.className = 'embed-shell';
                shell.dataset.embedIndex = index;
                loader.className = 'embed-loading';
                loader.setAttribute('aria-hidden', 'true');
                loaderText.textContent = 'LOADING ' + provider.toUpperCase() + '...';
                loader.appendChild(loaderText);

                frame.before(shell);
                shell.appendChild(frame);
                shell.appendChild(loader);
                frame.setAttribute('tabindex', '-1');

                function markEmbedReady() {
                    shell.classList.add('embed-ready');
                    frame.removeAttribute('tabindex');

                    if (group.classList.contains('visible')) {
                        window.setTimeout(function() {
                            if (group.classList.contains('visible')) {
                                shell.classList.add('embed-visible');
                            }
                        }, Math.min(index, 5) * 80);
                    }
                }

                frame.addEventListener('load', markEmbedReady);

                if (frame.dataset.embedLoaded === 'true') {
                    markEmbedReady();
                }
            });
        });

        document.addEventListener('DOMContentLoaded', function() {
            const video = document.getElementById('intro-video');
            const videoContainer = document.getElementById('video-container');
            const contentContainer = document.getElementById('content-container');
            const widgetsContainer = document.querySelector('.widgets-container');
            const platformButtons = document.querySelectorAll('button.platform-link');
            const headerVideo = document.querySelector('.header-video');
            const skleshTrailer = document.getElementById('sklesh-trailer');
            const skleshTrailerSource = 'https://video.akamai.steamstatic.com/store_trailers/4617070/1487669050/ee5ce0cfddebaaa617dc21e62fb7ca8700fdf8cc/1776811423/hls_264_master.m3u8?t=1776816847';
            let introState = 'pending';
            let introPlayAttempted = false;
            let contentVisible = false;
            let skleshHls = null;
            let skleshTrailerInitialized = false;
            
            if (window.matchMedia('(dynamic-range: high)').matches) {
                video.src = 'introHDR.mp4';
                headerVideo.src = 'headerHDR.mp4';
            } else {
                video.src = 'introSDR.mp4';
                headerVideo.src = 'headerSDR.mp4';
            }

            function showContent() {
                if (contentVisible) return;
                contentVisible = true;
                document.body.classList.add('content-visible');
                videoContainer.classList.add('hidden');
                contentContainer.classList.add('visible');

                const headerPlayback = headerVideo.play();
                if (headerPlayback !== undefined) {
                    headerPlayback.catch(function() {});
                }

                initializeSkleshTrailer();
            }

            function markIntroPlaying() {
                if (introState === 'pending') {
                    introState = 'playing';
                }
            }

            function showAutoplayFallback(error) {
                if (error && error.name === 'AbortError') return;
                if (introState !== 'pending') return;
                introState = 'fallback';
                showContent();
            }

            function startVideo() {
                if (introPlayAttempted || introState !== 'pending') return;
                introPlayAttempted = true;

                let introPlayback;
                try {
                    introPlayback = video.play();
                } catch (error) {
                    showAutoplayFallback(error);
                    return;
                }

                if (introPlayback !== undefined) {
                    introPlayback.then(markIntroPlaying).catch(showAutoplayFallback);
                }
            }

            function startSkleshTrailer() {
                skleshTrailer.muted = true;
                skleshTrailer.controls = false;
                let trailerPlayback;

                try {
                    trailerPlayback = skleshTrailer.play();
                } catch (_error) {
                    skleshTrailer.controls = true;
                    return;
                }

                if (trailerPlayback !== undefined) {
                    trailerPlayback.catch(function() {
                        skleshTrailer.controls = true;
                    });
                }
            }

            function initializeSkleshTrailer() {
                if (skleshTrailerInitialized) return;
                skleshTrailerInitialized = true;

                if (window.Hls && Hls.isSupported()) {
                    skleshHls = new Hls();
                    skleshHls.on(Hls.Events.MANIFEST_PARSED, startSkleshTrailer);
                    skleshHls.loadSource(skleshTrailerSource);
                    skleshHls.attachMedia(skleshTrailer);
                    skleshHls.on(Hls.Events.ERROR, function(_event, data) {
                        if (!data.fatal) return;
                        if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
                            skleshHls.recoverMediaError();
                        } else {
                            skleshHls.destroy();
                            skleshHls = null;
                        }
                    });
                } else if (skleshTrailer.canPlayType('application/vnd.apple.mpegurl')) {
                    skleshTrailer.src = skleshTrailerSource;
                    startSkleshTrailer();
                }
            }

            function showPlatformWidgets(platform) {
                const steamWidgets = document.querySelector('.steam-widgets');
                const itchWidgets = document.querySelector('.itch-widgets');
                
                // Reset all buttons
                platformButtons.forEach(btn => btn.classList.remove('active'));
                
                // Hide all widgets first
                steamWidgets.classList.remove('visible');
                itchWidgets.classList.remove('visible');
                widgetGroups.forEach(function(group) {
                    group.querySelectorAll('.embed-shell').forEach(function(shell) {
                        shell.classList.remove('embed-visible');
                    });
                });
                
                // Show selected platform widgets
                if (platform === 'steam') {
                    steamWidgets.classList.add('visible');
                    document.querySelector('[data-platform="steam"]').classList.add('active');
                    window.requestAnimationFrame(function() {
                        window.requestAnimationFrame(function() {
                            observeLazyEmbeds(steamWidgets);
                            revealReadyEmbeds(steamWidgets);
                        });
                    });
                } else if (platform === 'itch') {
                    itchWidgets.classList.add('visible');
                    document.querySelector('[data-platform="itch"]').classList.add('active');
                    window.requestAnimationFrame(function() {
                        window.requestAnimationFrame(function() {
                            observeLazyEmbeds(itchWidgets);
                            revealReadyEmbeds(itchWidgets);
                        });
                    });
                }
                
                // Show widgets container
                widgetsContainer.classList.add('visible');
            }

            // Add click event listeners to platform buttons
            platformButtons.forEach(button => {
                button.addEventListener('click', () => {
                    showPlatformWidgets(button.dataset.platform);
                });
            });

            video.addEventListener('playing', markIntroPlaying, { once: true });
            video.addEventListener('loadedmetadata', startVideo, { once: true });

            video.addEventListener('ended', showContent);
            video.addEventListener('error', function() {
                if (!video.error || video.error.code !== 1) {
                    introState = 'fallback';
                    showContent();
                }
            });

            if (video.readyState >= HTMLMediaElement.HAVE_METADATA) {
                startVideo();
            }
        });
