<html lang="en">
<head>
    <meta charset="UTF-8">

    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <script>
        document.addEventListener('load', function(event) {
            if (event.target instanceof HTMLIFrameElement && event.target.hasAttribute('src')) {
                event.target.dataset.embedLoaded = 'true';
            }
        }, true);
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/hls.js@1.6.16/dist/hls.min.js" integrity="sha384-5E8B0pTlZZJMabWpC0fyYf6OUpe15jJij34BqBAh4NXoHAlLNOjCPRrwtOXOQFAn" crossorigin="anonymous"></script>
    <script src="/assets/itch-embed-colors.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            min-height: 100%;
            background: black;
            dynamic-range-limit: no-limit;
        }
        
        body {
            background: black;
            min-height: 100vh;
            min-height: 100lvh;
            overflow-x: hidden;
            font-family: 'Press Start 2P', cursive;
        }

        #video-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            height: 100lvh;
            z-index: 1;
            opacity: 1;
            transition: opacity 0.5s ease-out;
        }

        #video-container.hidden {
            opacity: 0;
            pointer-events: none;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: black;
        }

        /* Feathered soft edge - vignette into the black page background (no box) */
        #video-container video {
            -webkit-mask-image: radial-gradient(ellipse 120% 86% at 50% 50%, black 58%, transparent 93%);
            mask-image: radial-gradient(ellipse 120% 86% at 50% 50%, black 58%, transparent 93%);
            -webkit-mask-repeat: no-repeat;
            mask-repeat: no-repeat;
            -webkit-mask-size: 100% 100%;
            mask-size: 100% 100%;
        }

        .header-video {
            width: 400px;
            height: 225px;
            margin-bottom: 40px;
            background: black;
            -webkit-mask-image: radial-gradient(ellipse 102% 98% at 50% 50%, black 66%, transparent 98%);
            mask-image: radial-gradient(ellipse 102% 98% at 50% 50%, black 66%, transparent 98%);
            -webkit-mask-repeat: no-repeat;
            mask-repeat: no-repeat;
            -webkit-mask-size: 100% 100%;
            mask-size: 100% 100%;
        }

        .trailer-wrap {
            position: relative;
            width: min(646px, calc(100vw - 40px));
            aspect-ratio: 16 / 9;
            /* Stacking context so the glow stays behind the trailer but above the page. */
            isolation: isolate;
        }

        .featured-trailer {
            display: block;
            position: relative;
            z-index: 1;
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: black;
            -webkit-mask-image: radial-gradient(ellipse 102% 96% at 50% 50%, black 64%, transparent 98%);
            mask-image: radial-gradient(ellipse 102% 96% at 50% 50%, black 64%, transparent 98%);
            -webkit-mask-repeat: no-repeat;
            mask-repeat: no-repeat;
            -webkit-mask-size: 100% 100%;
            mask-size: 100% 100%;
        }

        /* Realtime monitor glow: a downsampled copy of the current frame, blurred.
           Painted on two layers - a tight bright bloom and a wide room-light spill.
           The canvases stay small (224x126 / 96x54), so repainting is cheap and
           the blur runs on the compositor. */
        .trailer-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            z-index: 0;
            width: 100%;
            height: 100%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            opacity: 0;
            will-change: opacity;
            image-rendering: auto;
        }

        .trailer-glow-tight {
            width: 118%;
            height: 118%;
            filter: blur(48px) saturate(1.5);
        }

        .trailer-glow-wide {
            width: 170%;
            height: 170%;
            filter: blur(120px) saturate(1.5);
        }

        .trailer-glow-outer {
            width: 220%;
            height: 220%;
            filter: blur(180px) saturate(1.5);
        }

        /* Dust motes drifting through the monitor light. Each mote is lit by
           sampling the downsampled frame, so dust only shows where the glow
           actually falls - like dust in a light beam at night. */
        .trailer-dust {
            position: absolute;
            top: 50%;
            left: 50%;
            z-index: 2;
            width: 170%;
            height: 170%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        #content-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            height: 100lvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 40px;
            z-index: 0;
            opacity: 0;
            transition: opacity 0.5s ease-in;
            overflow-y: auto;
            /* The glow bleeds past the viewport edges; clip it without creating
               a horizontal scroll container (body overflow-x: hidden is the
               fallback for browsers without `clip`). */
            overflow-x: clip;
            padding: 40px 0;
            /* Keep in-flow content clear of the dynamic Safari controls. */
            padding:
                calc(40px + env(safe-area-inset-top, 0px))
                env(safe-area-inset-right, 0px)
                calc(40px + max(env(safe-area-inset-bottom, 0px), 24px))
                env(safe-area-inset-left, 0px);
        }

        #content-container.visible {
            opacity: 1;
        }

        .buttons-container {
            display: flex;
            gap: 40px;
            margin-top: 48px;
            margin-bottom: 40px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .widgets-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            opacity: 0;
            transition: opacity 0.3s ease;
            max-width: 100%;
            padding: 0 20px;
            margin-bottom: 40px;
        }

        .widgets-container.visible {
            opacity: 1;
        }

        .steam-widgets,
        .itch-widgets {
            display: none;
            flex-direction: column;
            gap: 20px;
        }

        .steam-widgets {
            width: min(646px, calc(100vw - 40px));
        }

        .itch-widgets {
            width: min(560px, calc(100vw - 40px));
        }

        .embed-shell {
            position: relative;
            width: 100%;
            overflow: hidden;
            background: #050505;
            isolation: isolate;
        }

        .steam-widgets .embed-shell {
            max-width: 646px;
            height: 190px;
        }

        .itch-widgets .embed-shell {
            max-width: 560px;
            height: 175px;
        }

        @media (max-width: 600px) {
            .itch-widgets .embed-shell {
                height: 220px;
            }
        }

        .embed-shell iframe {
            position: absolute;
            inset: 0;
            z-index: 2;
            display: block;
            width: 100%;
            height: 100%;
            opacity: 0;
            pointer-events: none;
            transform: scale(0.98);
            will-change: opacity, transform, mask-position;
            /* Diagonal gradient wipe: hidden until the reveal mask sweeps across. */
            -webkit-mask-image: linear-gradient(115deg, transparent 0%, black 28%, black 100%);
            mask-image: linear-gradient(115deg, transparent 0%, black 28%, black 100%);
            -webkit-mask-size: 250% 100%;
            mask-size: 250% 100%;
            -webkit-mask-repeat: no-repeat;
            mask-repeat: no-repeat;
            -webkit-mask-position: -100% 0;
            mask-position: -100% 0;
            transition: opacity 0.2s ease,
                transform 0.65s cubic-bezier(0.22, 1, 0.36, 1),
                -webkit-mask-position 0.65s cubic-bezier(0.22, 1, 0.36, 1),
                mask-position 0.65s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .embed-shell.embed-visible iframe {
            opacity: 1;
            pointer-events: auto;
            transform: scale(1);
            /* End past the ramp so the wipe edge fully leaves the frame. */
            -webkit-mask-position: 50% 0;
            mask-position: 50% 0;
        }

        .embed-loading {
            position: absolute;
            inset: 0;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            color: #b8c0c8;
            background: #000000;
            font-size: 9px;
            letter-spacing: 1px;
            text-align: center;
            transition: opacity 0.35s ease, visibility 0s linear 0.35s;
        }

        .embed-loading::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(110deg, transparent 25%, rgba(255, 255, 255, 0.07) 45%, transparent 65%);
            transform: translateX(-100%);
            animation: embed-loading-sweep 1.8s ease-in-out infinite;
        }

        .embed-loading span {
            position: relative;
            z-index: 1;
            animation: embed-loading-pulse 1.8s ease-in-out infinite;
        }

        .embed-shell.embed-visible .embed-loading {
            visibility: hidden;
            opacity: 0;
        }

        @keyframes embed-loading-sweep {
            to { transform: translateX(100%); }
        }

        @keyframes embed-loading-pulse {
            0%, 100% { opacity: 0.45; }
            50% { opacity: 0.9; }
        }

        .embed-error {
            position: absolute;
            inset: 0;
            z-index: 1;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: #000000;
            color: #b8c0c8;
            font-size: 9px;
            letter-spacing: 1px;
            text-align: center;
            padding: 16px;
        }

        .embed-error span {
            color: #b8c0c8;
        }

        .embed-retry {
            padding: 10px 14px;
            border: 2px solid white;
            background: transparent;
            color: white;
            font-family: 'Press Start 2P', cursive;
            font-size: 8px;
            letter-spacing: 1px;
            cursor: pointer;
            transition: background 0.2s ease, color 0.2s ease;
        }

        .embed-retry:hover {
            background: white;
            color: black;
        }

        .embed-error a.embed-fallback-link {
            color: #b8c0c8;
            font-size: 8px;
            letter-spacing: 1px;
            text-decoration: underline;
            text-underline-offset: 3px;
        }

        .embed-error a.embed-fallback-link:hover {
            color: white;
        }

        .embed-shell.embed-failed .embed-error {
            display: flex;
        }

        .embed-shell.embed-failed .embed-loading {
            visibility: hidden;
            opacity: 0;
        }

        .embed-shell.embed-failed .embed-cursor-overlay {
            display: none !important;
            pointer-events: none;
        }

        .steam-widgets.visible,
        .itch-widgets.visible {
            display: flex;
        }

        @media (prefers-reduced-motion: reduce) {
            .embed-shell iframe {
                transform: none;
                -webkit-mask-position: 50% 0;
                mask-position: 50% 0;
                transition: opacity 0.25s ease;
            }

            .embed-loading {
                transition-duration: 0.01ms;
            }

            .embed-loading::before,
            .embed-loading span {
                animation: none;
            }
        }

        .platform-link {
            color: white;
            text-decoration: none;
            background: transparent;
            /* Paint the rim inside the button so its bottom edge cannot be clipped. */
            border: 2px solid white;
            border-image: url('/assets/hdr-white.avif') 1 / 2px stretch;
            padding: 20px;
            font-size: 16px;
            transition: background-color 0.3s ease, color 0.3s ease, transform 0.3s ease;
            text-align: center;
            min-width: 180px;
            text-transform: uppercase;
            letter-spacing: 2px;
            image-rendering: pixelated;
            position: relative;
            cursor: pointer;
            font-family: 'Press Start 2P', cursive;
            dynamic-range-limit: no-limit;
        }

        .platform-link.active {
            background: white url('/assets/hdr-white.avif') center / 100% 100% no-repeat;
            color: black;
            border-color: transparent;
            border-image: none;
        }

        .platform-link:hover {
            transform: translateY(-5px);
        }

        .platform-link:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        .platform-link:disabled:hover {
            transform: none;
        }

        .blurb {
            text-align: center;
            color: white;
            font-family: 'Press Start 2P', cursive;
            font-size: 18px;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
            animation: pulse 2s ease-in-out infinite;
            margin-bottom: 40px;
            text-decoration: none;
            display: block;
            transition: all 0.3s ease;
        }
        
        .blurb:hover {
            transform: scale(1.1);
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.8);
        }

        .release-status {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .release-status .blurb {
            margin-bottom: 0;
        }

        .coming-soon {
            color: #b8c0c8;
            font-family: 'Press Start 2P', cursive;
            font-size: 11px;
            letter-spacing: 1px;
            text-align: center;
            text-shadow: 0 0 8px rgba(184, 192, 200, 0.5);
        }

        @keyframes pulse {
            0% { opacity: 0.7; }
            50% { opacity: 1; }
            100% { opacity: 0.7; }
        }

        .site-footer {
            padding: 20px 20px 40px;
            text-align: center;
        }

        .site-footer a {
            color: #b8c0c8;
            font-family: 'Press Start 2P', cursive;
            font-size: 10px;
            letter-spacing: 1px;
            text-decoration: none;
            text-transform: lowercase;
            transition: color 0.3s ease, text-shadow 0.3s ease;
        }

        .site-footer a:hover {
            color: white;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.7);
        }

        /* iPhone landscape is wider than 768px. Keep Safari on the page scroller. */
        @media (max-width: 1024px), (hover: none) and (pointer: coarse) {
            body {
                overflow-y: hidden;
            }

            body.content-visible {
                overflow-y: auto;
                -webkit-overflow-scrolling: touch;
            }

            #content-container {
                position: relative;
                top: auto;
                left: auto;
                min-height: 100vh;
                min-height: 100lvh;
                height: auto;
                overflow-y: visible;
                touch-action: pan-y;
            }

            .header-video {
                width: calc(100vw - 40px);
                height: auto;
                aspect-ratio: 16 / 9;
            }

            .buttons-container {
                flex-direction: column;
                gap: 30px;
            }

            .platform-link {
                font-size: 14px;
                padding: 15px;
                min-width: 160px;
            }

            .widgets-container {
                width: 100%;
                transform: none;
                gap: 6px;
            }

            .steam-widgets,
            .itch-widgets {
                width: 100%;
                align-items: center;
                gap: 4px;
            }

            .steam-widgets iframe,
            .itch-widgets iframe {
                width: 100%;
            }

            .steam-widgets iframe {
                max-width: 646px;
            }

            .itch-widgets iframe {
                max-width: 560px;
            }
        }

        /* Blocky RGB cursor: red left, green center, blue right. The white center
           sits one pixel above the color layers. There is no DOM follower. */
        :root {
            --windows-cursor: url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACAAAAAgCAYAAABzenr0AAAAIGNIUk0AAHomAACAhAAA+gAAAIDoAAB1MAAA6mAAADqYAAAXcJy6UTwAAAAGYktHRAAAAAAAAPlDu38AAACQSURBVFjD7ZZBCoAwDAQ3i///crxUqbG2HtpEJAMF2wg7rggCgJYVAgFAVRElweMiSoL1JkKC9sBbgq1DTwk+Dbwk2Bt6SHB0w2qJocBqia03FJGbCwDBRG4NNELFrKlcBBrhyzkFSrjUIm5fQR2OBTW/acCGilcL9H5iyyhcSwP2NU1t4POE/rIlSZIk/2cHS9I1Fe321T4AAAARdEVYdGNvbW1lbnQAYmxvY2t5LWEzc9eBsgAAAABJRU5ErkJggg==") 0 0, auto;
        }

        :root.cursor-variant-b {
            --windows-cursor: url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACAAAAAgCAYAAABzenr0AAAAIGNIUk0AAHomAACAhAAA+gAAAIDoAAB1MAAA6mAAADqYAAAXcJy6UTwAAAAGYktHRAAAAAAAAPlDu38AAACQSURBVFjD7ZZBCoAwDAQ3i///crxUqbG2HtpEJAMF2wg7rggCgJYVAgFAVRElweMiSoL1JkKC9sBbgq1DTwk+Dbwk2Bt6SHB0w2qJocBqia03FJGbCwDBRG4NNELFrKlcBBrhyzkFSrjUIm5fQR2OBTW/acCGilcL9H5iyyhcSwP2NU1t4POE/rIlSZIk/2cHS9I1Fe321T4AAAARdEVYdGNvbW1lbnQAYmxvY2t5LWIzWPrScQAAAABJRU5ErkJggg==") 0 0, auto;
        }

         /* Use the crisp RGB cursor assets for the final native cursor. */
         :root {
             --windows-cursor: url('/assets/windows-3.1-cursor-rgb-a.svg') 0 0, auto;
         }

         :root.cursor-variant-b {
             --windows-cursor: url('/assets/windows-3.1-cursor-rgb-b.svg') 0 0, auto;
         }

        :root {
            --windows-cursor-pointer: url('/assets/windows-3.1-cursor-pointer-rgb-a.svg') 10 10, auto;
        }

        :root.cursor-variant-b {
            --windows-cursor-pointer: url('/assets/windows-3.1-cursor-pointer-rgb-b.svg') 10 10, auto;
        }

        html,
        body,
        body *,
        iframe,
        .embed-cursor-overlay,
        .embed-loading,
        .embed-error {
            cursor: var(--windows-cursor) !important;
        }

        /* Hover — hand pointer with same trichromatic HDR gain-map */
        html body a:hover,
        html body button:hover,
        html body .platform-link:hover,
        html body .blurb:hover,
        html body .site-footer a:hover,
        html body .embed-cursor-overlay[href]:hover {
            cursor: var(--windows-cursor-pointer) !important;
        }

        /* Disabled should not show hand */
        html body .platform-link:disabled:hover,
        html body button:disabled:hover {
            cursor: var(--windows-cursor) !important;
        }

        .embed-cursor-overlay {
            position: absolute;
            inset: 0;
            z-index: 3;
            display: block;
            cursor: var(--windows-cursor) !important;
        }

    </style>
</head>

                        return true;
                    } catch (error) {
                        if (error && (error.name === 'SecurityError' || error.code === 18)) {
                            // Tainted media: never paint, keep the glow off.
                            glowBroken = true;
                        }
                        return false;
                    }
                }

                function updateGlowOpacity(now, fadeInStep, fadeOutStep) {
                    const playing = !skleshTrailer.paused && !skleshTrailer.ended;
                    const awake = playing && !document.hidden && glowInView && !glowBroken;
                    if (awake) {
                        glowFade = Math.min(1, glowFade + fadeInStep);
                        if (!prefersReducedMotion) {
                            if (now >= glowNextFlicker) {
                                glowFlickerTarget = 0.9 + Math.random() * 0.18;
                                glowNextFlicker = now + 90 + Math.random() * 280;
                            }
                            glowFlicker += (glowFlickerTarget - glowFlicker) * 0.08;
                        }
                    } else {
                        glowFade = Math.max(0, glowFade - fadeOutStep);
                    }
                    const tight = (prefersReducedMotion ? 0.28 : 0.35 * glowFlicker) * glowFade;
                    const wide = (prefersReducedMotion ? 0.15 : 0.18 * (0.6 + 0.4 * glowFlicker)) * glowFade;
                    const outer = (prefersReducedMotion ? 0.06 : 0.08 * (0.6 + 0.4 * glowFlicker)) * glowFade;
                    glowTight.style.opacity = String(tight);
                    glowWide.style.opacity = String(wide);
                    glowOuter.style.opacity = String(outer);
                }

                if (prefersReducedMotion) {
                    // No flicker and no per-frame repaints: refresh the ambient
                    // light once every few seconds instead.
                    let wasAwake = false;
                    window.setInterval(function() {
                        const now = Date.now();
                        const awake = !glowBroken && !skleshTrailer.paused &&
                            !document.hidden && glowInView;
                        if (awake && !wasAwake) {
                            // Paint immediately so the fade-in has light to show.
                            paintGlowFrame();
                            glowLastDraw = now;
                        }
                        wasAwake = awake;
                        if (awake && now - glowLastDraw > 3000) {
                            glowLastDraw = now;
                            paintGlowFrame();
                        }
                        updateGlowOpacity(now, 0.5, 0.75);
                    }, 1000);
                    return;
                }

                // Dust motes: tiny drifting specks lit only where the monitor
                // light falls. Positions are region units (0..1 of the dust
                // canvas), velocities are tiny, and each mote samples the
                // luminance field, so the dust breathes with the frame and
                // flickers with the screen. Super subtle by design.
                const dustCanvas = document.getElementById('trailer-dust');
                let renderDust = null;
                let dustLastDraw = 0;
                if (dustCanvas && dustCanvas.getContext) {
                    const dustCtx = dustCanvas.getContext('2d');
                    dustActive = true;
                    const DUST_COUNT = 64;
                    const DUST_MAX_ALPHA = 0.1;

                    // One soft near-white sprite, scaled per mote.
                    const dustSprite = document.createElement('canvas');
                    dustSprite.width = 24;
                    dustSprite.height = 24;
                    (function() {
                        const sctx = dustSprite.getContext('2d');
                        const grad = sctx.createRadialGradient(12, 12, 0, 12, 12, 12);
                        grad.addColorStop(0, 'rgba(236, 242, 255, 1)');
                        grad.addColorStop(0.35, 'rgba(236, 242, 255, 0.35)');
                        grad.addColorStop(0.7, 'rgba(236, 242, 255, 0.08)');
                        grad.addColorStop(1, 'rgba(236, 242, 255, 0)');
                        sctx.fillStyle = grad;
                        sctx.fillRect(0, 0, 24, 24);
                    })();

                    const dust = [];
                    for (let i = 0; i < DUST_COUNT; i++) {
                        dust.push({
                            x: Math.random(),
                            y: Math.random(),
                            z: 0.5 + Math.random() * 1.1, // 0.5 near ... 1.6 far
                            size: 3 + Math.random() * 6,  // sprite px at z=1
                            vx: (Math.random() - 0.5) * 0.008, // ~4 px/s at 1000px wide
                            vy: -0.0023 - Math.random() * 0.005,
                            sway: Math.random() * Math.PI * 2,
                            twinklePhase: Math.random() * Math.PI * 2,
                            twinkleFreq: 0.25 + Math.random() * 0.65
                        });
                    }
                    let dustLastTime = 0;
                    let dustCleared = true;

                    function sampleLight(u, v) {
                        if (!lumaData) return 0;
                        const w = lumaCanvas.width;
                        const h = lumaCanvas.height;
                        const fx = Math.max(0, Math.min(1, u)) * (w - 1);
                        const fy = Math.max(0, Math.min(1, v)) * (h - 1);
                        const x0 = Math.floor(fx);
                        const y0 = Math.floor(fy);
                        const x1 = Math.min(w - 1, x0 + 1);
                        const y1 = Math.min(h - 1, y0 + 1);
                        const tx = fx - x0;
                        const ty = fy - y0;
                        function lum(px, py) {
                            const i = (py * w + px) * 4;
                            return (0.2126 * lumaData[i] + 0.7152 * lumaData[i + 1] + 0.0722 * lumaData[i + 2]) / 255;
                        }
                        const l00 = lum(x0, y0);
                        const l10 = lum(x1, y0);
                        const l01 = lum(x0, y1);
                        const l11 = lum(x1, y1);
                        return (l00 * (1 - tx) + l10 * tx) * (1 - ty) + (l01 * (1 - tx) + l11 * tx) * ty;
                    }

                    renderDust = function(now) {
                        // Keep the backing store in sync with the responsive wrap.
                        const targetW = Math.max(8, Math.round(dustCanvas.clientWidth));
                        const targetH = Math.max(8, Math.round(dustCanvas.clientHeight));
                        if (dustCanvas.width !== targetW || dustCanvas.height !== targetH) {
                            dustCanvas.width = targetW;
                            dustCanvas.height = targetH;
                        }
                        if (glowFade <= 0.002) {
                            if (!dustCleared) {
                                dustCleared = true;
                                dustCtx.clearRect(0, 0, dustCanvas.width, dustCanvas.height);
                            }
                            return;
                        }
                        dustCleared = false;
                        const dt = Math.min(0.1, Math.max(0, (now - dustLastTime) / 1000));
                        dustLastTime = now;
                        const t = now / 1000;
                        const w = dustCanvas.width;
                        const h = dustCanvas.height;
                        const margin = 24 / Math.max(1, w);
                        dustCtx.clearRect(0, 0, w, h);
                        dustCtx.globalCompositeOperation = 'lighter';
                        dust.sort(function(a, b) { return a.z - b.z; }); // far first
                        for (let i = 0; i < dust.length; i++) {
                            const p = dust[i];
                            // Slow drift: gentle sway plus a hint of buoyancy.
                            p.x += (p.vx + Math.sin(t * 0.4 + p.sway) * 0.0022) * p.z * dt;
                            p.y += (p.vy + Math.cos(t * 0.3 + p.sway) * 0.0011) * p.z * dt;
                            if (p.x < -margin) { p.x = 1 + margin; p.y = Math.random(); }
                            else if (p.x > 1 + margin) { p.x = -margin; p.y = Math.random(); }
                            if (p.y < -margin) p.y = 1 + margin;
                            else if (p.y > 1 + margin) p.y = -margin;

                            // How much light falls on this mote right now.
                            const lit = sampleLight(p.x, p.y);
                            if (lit <= 0.06) continue;
                            const twinkle = 0.7 + 0.3 * Math.sin(t * p.twinkleFreq + p.twinklePhase);
                            const flickerMix = 0.35 + 0.65 * glowFlicker;
                            const depthAlpha = 1.25 - p.z * 0.5;
                            const alpha = Math.pow((lit - 0.06) / 0.5, 1.25) *
                                twinkle * flickerMix * glowFade * depthAlpha * DUST_MAX_ALPHA;
                            if (alpha <= 0.004) continue;
                            const size = p.size / p.z;
                            dustCtx.globalAlpha = alpha;
                            dustCtx.drawImage(dustSprite, p.x * w - size / 2, p.y * h - size / 2, size, size);
                        }
                        dustCtx.globalAlpha = 1;
                        dustCtx.globalCompositeOperation = 'source-over';
                    }
                }

                function renderGlow(now) {
                    if (!glowBroken) {
                        const playing = !skleshTrailer.paused && !skleshTrailer.ended;
                        if (playing && !document.hidden && glowInView &&
                            now - glowLastDraw >= 33) { // ~30 fps ceiling
                            glowLastDraw = now;
                            paintGlowFrame();
                        }
                    }
                    updateGlowOpacity(now, 0.025, 0.04);
                    if (dustActive && !document.hidden && glowInView &&
                        now - dustLastDraw >= 33) {
                        dustLastDraw = now;
                        renderDust(now);
                    }
                    requestAnimationFrame(renderGlow);
                }
                requestAnimationFrame(renderGlow);
            })();

            function showPlatformWidgets(platform) {
                const steamWidgets = document.querySelector('.steam-widgets');
                const itchWidgets = document.querySelector('.itch-widgets');
                
                // Reset all buttons
                platformButtons.forEach(btn => btn.classList.remove('active'));
                
                // Hide all widgets first
                steamWidgets.classList.remove('visible');
                itchWidgets.classList.remove('visible');
                widgetGroups.forEach(function(group) {
                    group.querySelectorAll('.embed-shell').forEach(function(shell) {
                        shell.classList.remove('embed-visible');
                    });
                });
                
                // Show selected platform widgets
                if (platform === 'steam') {
                    steamWidgets.classList.add('visible');
                    document.querySelector('[data-platform="steam"]').classList.add('active');
                    window.requestAnimationFrame(function() {
                        window.requestAnimationFrame(function() {
                            observeLazyEmbeds(steamWidgets);
                            revealReadyEmbeds(steamWidgets);
                        });
                    });
                } else if (platform === 'itch') {
                    itchWidgets.classList.add('visible');
                    document.querySelector('[data-platform="itch"]').classList.add('active');
                    window.requestAnimationFrame(function() {
                        window.requestAnimationFrame(function() {
                            observeLazyEmbeds(itchWidgets);
                            revealReadyEmbeds(itchWidgets);
                        });
                    });
                }
                
                // Show widgets container
                widgetsContainer.classList.add('visible');
            }

            // Add click event listeners to platform buttons
            platformButtons.forEach(button => {
                button.addEventListener('click', () => {
                    if (button.disabled) return;
                    showPlatformWidgets(button.dataset.platform);
                });
            });

            video.addEventListener('playing', markIntroPlaying, { once: true });
            video.addEventListener('loadedmetadata', startVideo, { once: true });

            video.addEventListener('ended', showContent);
            video.addEventListener('error', function() {
                if (!video.error || video.error.code !== 1) {
                    introState = 'fallback';
                    showContent();
                }
            });

            if (video.readyState >= HTMLMediaElement.HAVE_METADATA) {
                startVideo();
            }
        });
    </script>
</body>
</html>
