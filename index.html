<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three Hands Co</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: black;
            min-height: 100vh;
            overflow-x: hidden;
            font-family: 'Press Start 2P', cursive;
        }

        #video-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            z-index: 1;
            opacity: 1;
            transition: opacity 0.5s ease-out;
        }

        #video-container.hidden {
            opacity: 0;
            pointer-events: none;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: black;
        }

        .logo {
            width: 150px;
            height: 150px;
            margin-bottom: 40px;
            border: 3px solid white;
        }

        #content-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 40px;
            z-index: 0;
            opacity: 0;
            transition: opacity 0.5s ease-in;
        }

        #content-container.visible {
            opacity: 1;
        }

        .buttons-container {
            display: flex;
            gap: 40px;
            margin-bottom: 40px;
        }

        .iframes-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .platform-link {
            color: white;
            text-decoration: none;
            background: transparent;
            border: 3px solid white;
            padding: 20px;
            font-size: 16px;
            transition: all 0.3s ease;
            text-align: center;
            min-width: 180px;
            text-transform: uppercase;
            letter-spacing: 2px;
            image-rendering: pixelated;
            position: relative;
        }

        .platform-link::before {
            content: '';
            position: absolute;
            top: -5px;
            left: -5px;
            right: -5px;
            bottom: -5px;
            border: 2px solid white;
            opacity: 0;
            transition: all 0.3s ease;
        }

        .platform-link:hover::before {
            opacity: 1;
            animation: glow 1.5s ease-in-out infinite alternate;
        }

                    @keyframes glow {
            from {
                box-shadow: 0 0 5px rgba(255, 255, 255, 0.5),
                           0 0 10px rgba(255, 255, 255, 0.3);
            }
            to {
                box-shadow: 0 0 8px rgba(255, 255, 255, 0.6),
                           0 0 15px rgba(255, 255, 255, 0.4);
            }
        }

        .platform-link:hover {
            background: white;
            color: black;
            transform: translateY(-5px);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.7);
        }

        @media (max-width: 768px) {
            .buttons-container {
                flex-direction: column;
                gap: 30px;
            }

            .platform-link {
                font-size: 14px;
                padding: 15px;
                min-width: 160px;
            }

            .iframes-container {
                transform: scale(0.8);
            }
        }
    </style>
</head>
<body>
    <div id="video-container">
        <video 
            id="intro-video" 
            muted 
            playsinline 
            preload="auto"
            defaultMuted>
            <source src="introHDR.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
    </div>
    
    <div id="content-container">
        <img src="logo.png" alt="Logo" class="logo">
        <div class="buttons-container">
            <a href="#" class="platform-link">Steam</a>
            <a href="https://threehandgames.itch.io" class="platform-link">Itch.io</a>
            <a href="#" class="platform-link">Other</a>
        </div>
        <div class="iframes-container">
            <iframe frameborder="0" src="https://itch.io/embed/2861591?linkback=true&border_width=0&bg_color=000000&fg_color=ffffff&link_color=ffffff&border_color=000000" width="550" height="165"><a href="https://threehandgames.itch.io/vr">Vortex Rain by ThreeHandGames</a></iframe>
            <iframe frameborder="0" src="https://itch.io/embed/3150845?bg_color=000000&fg_color=bababa&link_color=ffffff&border_color=000000" width="552" height="167"><a href="https://threehandgames.itch.io/emo">EMO by ThreeHandGames</a></iframe>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const video = document.getElementById('intro-video');
            const videoContainer = document.getElementById('video-container');
            const contentContainer = document.getElementById('content-container');
            
            if (window.matchMedia('(dynamic-range: high)').matches) {
                video.src = 'introHDR.mp4';
            } else {
                video.src = 'introSDR.mp4';
            }

            function startVideo() {
                video.play().catch(function(error) {
                    console.log("Video play failed:", error);
                    document.body.addEventListener('click', function() {
                        video.play();
                    }, { once: true });
                });
            }

            function showContent() {
                videoContainer.classList.add('hidden');
                contentContainer.classList.add('visible');
            }

            video.addEventListener('loadedmetadata', function() {
                startVideo();
            });

            video.addEventListener('ended', showContent);
            video.addEventListener('error', showContent);

            if (video.readyState >= 2) {
                startVideo();
            }
        });
    </script>
</body>
</html>
