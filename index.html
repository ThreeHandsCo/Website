    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: black;
            min-height: 100vh;
            overflow-x: hidden;
            font-family: 'Press Start 2P', cursive;
        }

        #video-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            z-index: 1;
            opacity: 1;
            transition: opacity 0.5s ease-out;
        }

        #video-container.hidden {
            opacity: 0;
            pointer-events: none;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: black;
        }

        .header-video {
            width: 400px;
            height: 225px;
            margin-bottom: 40px;
            background: black;
        }

        #content-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 40px;
            z-index: 0;
            opacity: 0;
            transition: opacity 0.5s ease-in;
            overflow-y: auto;
            padding: 40px 0;
        }

        #content-container.visible {
            opacity: 1;
        }

        .buttons-container {
            display: flex;
            gap: 40px;
            margin-bottom: 40px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .widgets-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            opacity: 0;
            transition: opacity 0.5s ease;
            max-width: 100%;
            padding: 0 20px;
            margin-bottom: 40px;
        }

        .widgets-container.visible {
            opacity: 1;
        }

        .steam-widgets,
        .itch-widgets {
            display: none;
            flex-direction: column;
            gap: 20px;
        }

        .steam-widgets.visible,
        .itch-widgets.visible {
            display: flex;
        }

        .platform-link {
            color: white;
            text-decoration: none;
            background: transparent;
            border: 3px solid white;
            padding: 20px;
            font-size: 16px;
            transition: all 0.3s ease;
            text-align: center;
            min-width: 180px;
            text-transform: uppercase;
            letter-spacing: 2px;
            image-rendering: pixelated;
            position: relative;
            cursor: pointer;
            font-family: 'Press Start 2P', cursive;
        }

        .platform-link.active {
            background: white;
            color: black;
        }

        .platform-link::before {
            content: '';
            position: absolute;
            top: -5px;
            left: -5px;
            right: -5px;
            bottom: -5px;
            border: 2px solid white;
            opacity: 0;
            transition: all 0.3s ease;
        }

        .platform-link:hover::before {
            opacity: 1;
            animation: glow 1.5s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from {
                box-shadow: 0 0 5px rgba(255, 255, 255, 0.5),
                           0 0 10px rgba(255, 255, 255, 0.3);
            }
            to {
                box-shadow: 0 0 8px rgba(255, 255, 255, 0.6),
                           0 0 15px rgba(255, 255, 255, 0.4);
            }
        }

        .platform-link:hover {
            background: white;
            color: black;
            transform: translateY(-5px);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.7);
        }

        .contact-link {
            font-size: 12px;
            letter-spacing: 1px;
            text-transform: lowercase;
            white-space: nowrap;
        }

        .blurb {
            text-align: center;
            color: white;
            font-family: 'Press Start 2P', cursive;
            font-size: 18px;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
            animation: pulse 2s ease-in-out infinite;
            margin-bottom: 40px;
            text-decoration: none;
            display: block;
            transition: all 0.3s ease;
        }
        
        .blurb:hover {
            transform: scale(1.1);
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.8);
        }

        @keyframes pulse {
            0% { opacity: 0.7; }
            50% { opacity: 1; }
            100% { opacity: 0.7; }
        }

        @media (max-width: 768px) {
            .buttons-container {
                flex-direction: column;
                gap: 30px;
            }

            .platform-link {
                font-size: 14px;
                padding: 15px;
                min-width: 160px;
            }

            .contact-link {
                font-size: 10px;
            }

            .widgets-container {
                transform: scale(0.8);
            }
        }
    </style>
</head>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const video = document.getElementById('intro-video');
            const videoContainer = document.getElementById('video-container');
            const contentContainer = document.getElementById('content-container');
            const widgetsContainer = document.querySelector('.widgets-container');
            const platformButtons = document.querySelectorAll('button.platform-link');
            
            if (window.matchMedia('(dynamic-range: high)').matches) {
                video.src = 'introHDR.mp4';
                document.querySelector('.header-video').src = 'headerHDR.mp4';
            } else {
                video.src = 'introSDR.mp4';
                document.querySelector('.header-video').src = 'headerSDR.mp4';
            }

            function startVideo() {
                video.play().catch(function(error) {
                    console.log("Video play failed:", error);
                    document.body.addEventListener('click', function() {
                        video.play();
                        document.querySelector('.header-video').play();
                    }, { once: true });
                });
                document.querySelector('.header-video').play().catch(console.error);
            }

            function showContent() {
                videoContainer.classList.add('hidden');
                contentContainer.classList.add('visible');
            }

            function showPlatformWidgets(platform) {
                const steamWidgets = document.querySelector('.steam-widgets');
                const itchWidgets = document.querySelector('.itch-widgets');
                
                // Reset all buttons
                platformButtons.forEach(btn => btn.classList.remove('active'));
                
                // Hide all widgets first
                steamWidgets.classList.remove('visible');
                itchWidgets.classList.remove('visible');
                
                // Show selected platform widgets
                if (platform === 'steam') {
                    steamWidgets.classList.add('visible');
                    document.querySelector('[data-platform="steam"]').classList.add('active');
                } else if (platform === 'itch') {
                    itchWidgets.classList.add('visible');
                    document.querySelector('[data-platform="itch"]').classList.add('active');
                }
                
                // Show widgets container
                widgetsContainer.classList.add('visible');
            }

            // Add click event listeners to platform buttons
            platformButtons.forEach(button => {
                button.addEventListener('click', () => {
                    showPlatformWidgets(button.dataset.platform);
                });
            });

            video.addEventListener('loadedmetadata', function() {
                startVideo();
            });

            video.addEventListener('ended', showContent);
            video.addEventListener('error', showContent);

            if (video.readyState >= 2) {
                startVideo();
            }
        });
    </script>
