<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three Hands Co</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: black;
            min-height: 100vh;
            overflow: hidden;
            font-family: 'Press Start 2P', cursive;
        }

        #video-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            z-index: 1;
            opacity: 1;
            transition: opacity 0.5s ease-out;
        }

        #video-container.hidden {
            opacity: 0;
            pointer-events: none;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: black;
        }

        #content-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 40px;
            z-index: 0;
            opacity: 0;
            transition: opacity 0.5s ease-in;
        }

        #content-container.visible {
            opacity: 1;
        }

        .platform-link {
            color: white;
            text-decoration: none;
            background: transparent;
            border: 3px solid white;
            padding: 20px;
            font-size: 16px;
            transition: all 0.3s ease;
            text-align: center;
            min-width: 180px;
            text-transform: uppercase;
            letter-spacing: 2px;
            image-rendering: pixelated;
        }
            /* HDR Enhancements */
        @media (dynamic-range: high) {
            .platform-link {
                color: color(display-p3 1 1 1);
                border-color: color(display-p3 1 1 1);
                text-shadow: 0 0 15px color(display-p3 1 1 1 / 0.4);
                box-shadow: 0 0 25px color(display-p3 1 1 1 / 0.3);
            }

            .platform-link:hover {
                background: color(display-p3 1 1 1);
                box-shadow: 0 0 40px color(display-p3 1 1 1 / 0.6),
                            0 0 60px color(display-p3 1 1 1 / 0.3);
                text-shadow: 0 0 20px color(display-p3 1 1 1 / 0.6);
            }
        }

        /* Fallback for browsers that support HDR but not display-p3 */
        @supports (color: color(display-p3 1 1 1)) {
            @media (dynamic-range: high) {
                .platform-link:hover {
                    color: black;
                }
            }
        }

        .platform-link:hover {
            background: white;
            color: black;
            transform: translateY(-5px);
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        @media (max-width: 768px) {
            #content-container {
                flex-direction: column;
                gap: 30px;
            }

            .platform-link {
                font-size: 14px;
                padding: 15px;
                min-width: 160px;
            }
        }
    </style>
</head>
<body>
    <div id="video-container">
        <video 
            id="intro-video" 
            muted 
            playsinline 
            preload="auto"
            defaultMuted>
            <source src="introHDR.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
    </div>
    
    <div id="content-container">
        <a href="#" class="platform-link">Steam</a>
        <a href="https://threehandgames.itch.io" class="platform-link">Itch.io</a>
        <a href="#" class="platform-link">Other</a>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const video = document.getElementById('intro-video');
            const videoContainer = document.getElementById('video-container');
            const contentContainer = document.getElementById('content-container');
            
            //check if hdr is supported
            if (window.matchMedia('(dynamic-range: high)').matches) {
                video.src = 'introHDR.mp4';
            } else {
                video.src = 'introSDR.mp4';
            }
            function startVideo() {
                video.play().catch(function(error) {
                    console.log("Video play failed:", error);
                    document.body.addEventListener('click', function() {
                        video.play();
                    }, { once: true });
                });
            }

            function showContent() {
                videoContainer.classList.add('hidden');
                contentContainer.classList.add('visible');
            }

            video.addEventListener('loadedmetadata', function() {
                startVideo();
            });

            video.addEventListener('ended', showContent);
            video.addEventListener('error', showContent);

            if (video.readyState >= 2) {
                startVideo();
            }
        });
    </script>
</body>
</html>
