<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Intro</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        body {
            background: black;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100vw;
        }
        #video-container, #content-container {
            position: absolute;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        #content-container {
            display: none;
            flex-direction: column;
            text-align: center;
            color: white;
        }
        #content-container img {
            max-width: 80%;
            height: auto;
            margin-bottom: 20px;
        }
        a {
            color: white;
            font-size: 24px;
            text-decoration: none;
            background: #222;
            padding: 10px 20px;
            border-radius: 5px;
        }
        a:hover {
            background: #444;
        }
    </style>
</head>
<body>
    <div id="video-container">
        <video id="intro-video" autoplay>
            <source src="intro.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
    </div>

    <!-- <div id="content-container">
        <img src="image.jpg" alt="Your Image">
        <a href="https://example.com">Click Here</a>
    </div> -->

    <script>
        const video = document.getElementById("intro-video");
        const videoContainer = document.getElementById("video-container");
        const contentContainer = document.getElementById("content-container");

        video.onended = () => {
            videoContainer.style.display = "none";  // Hide video
            contentContainer.style.display = "flex";  // Show content
        };
    </script>
</body>
</html>
