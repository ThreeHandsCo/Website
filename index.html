<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Three Hands Co</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <script>
        document.addEventListener('load', function(event) {
            if (event.target instanceof HTMLIFrameElement && event.target.hasAttribute('src')) {
                event.target.dataset.embedLoaded = 'true';
            }
        }, true);
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/hls.js@1.6.16/dist/hls.min.js" integrity="sha384-5E8B0pTlZZJMabWpC0fyYf6OUpe15jJij34BqBAh4NXoHAlLNOjCPRrwtOXOQFAn" crossorigin="anonymous"></script>
    <script src="/assets/itch-embed-colors.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            min-height: 100%;
            background: black;
            dynamic-range-limit: no-limit;
        }
        
        body {
            background: black;
            min-height: 100vh;
            min-height: 100lvh;
            overflow-x: hidden;
            font-family: 'Press Start 2P', cursive;
        }

        #video-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            height: 100lvh;
            z-index: 1;
            opacity: 1;
            transition: opacity 0.5s ease-out;
        }

        #video-container.hidden {
            opacity: 0;
            pointer-events: none;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: black;
        }

        /* Feathered soft edge - vignette into the black page background (no box) */
        #video-container video {
            -webkit-mask-image: radial-gradient(ellipse 120% 86% at 50% 50%, black 58%, transparent 93%);
            mask-image: radial-gradient(ellipse 120% 86% at 50% 50%, black 58%, transparent 93%);
            -webkit-mask-repeat: no-repeat;
            mask-repeat: no-repeat;
            -webkit-mask-size: 100% 100%;
            mask-size: 100% 100%;
        }

        .header-video {
            width: 400px;
            height: 225px;
            margin-bottom: 40px;
            background: black;
            -webkit-mask-image: radial-gradient(ellipse 102% 98% at 50% 50%, black 66%, transparent 98%);
            mask-image: radial-gradient(ellipse 102% 98% at 50% 50%, black 66%, transparent 98%);
            -webkit-mask-repeat: no-repeat;
            mask-repeat: no-repeat;
            -webkit-mask-size: 100% 100%;
            mask-size: 100% 100%;
        }

        .featured-trailer {
            width: min(646px, calc(100vw - 40px));
            height: auto;
            aspect-ratio: 16 / 9;
            object-fit: contain;
            background: black;
            -webkit-mask-image: radial-gradient(ellipse 102% 96% at 50% 50%, black 64%, transparent 98%);
            mask-image: radial-gradient(ellipse 102% 96% at 50% 50%, black 64%, transparent 98%);
            -webkit-mask-repeat: no-repeat;
            mask-repeat: no-repeat;
            -webkit-mask-size: 100% 100%;
            mask-size: 100% 100%;
        }

        #content-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            height: 100lvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 40px;
            z-index: 0;
            opacity: 0;
            transition: opacity 0.5s ease-in;
            overflow-y: auto;
            padding: 40px 0;
            /* Keep in-flow content clear of the dynamic Safari controls. */
            padding:
                calc(40px + env(safe-area-inset-top, 0px))
                env(safe-area-inset-right, 0px)
                calc(40px + max(env(safe-area-inset-bottom, 0px), 24px))
                env(safe-area-inset-left, 0px);
        }

        #content-container.visible {
            opacity: 1;
        }

        .buttons-container {
            display: flex;
            gap: 40px;
            margin-top: 48px;
            margin-bottom: 40px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .widgets-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            opacity: 0;
            transition: opacity 0.5s ease;
            max-width: 100%;
            padding: 0 20px;
            margin-bottom: 40px;
        }

        .widgets-container.visible {
            opacity: 1;
        }

        .steam-widgets,
        .itch-widgets {
            display: none;
            flex-direction: column;
            gap: 20px;
        }

        .steam-widgets {
            width: min(646px, calc(100vw - 40px));
        }

        .itch-widgets {
            width: min(560px, calc(100vw - 40px));
        }

        .embed-shell {
            position: relative;
            width: 100%;
            overflow: hidden;
            background: #050505;
            isolation: isolate;
        }

        .steam-widgets .embed-shell {
            max-width: 646px;
            height: 190px;
        }

        .itch-widgets .embed-shell {
            max-width: 560px;
            height: 175px;
        }

        @media (max-width: 600px) {
            .itch-widgets .embed-shell {
                height: 220px;
            }
        }

        .embed-shell iframe {
            position: absolute;
            inset: 0;
            z-index: 2;
            display: block;
            width: 100%;
            height: 100%;
            opacity: 0;
            pointer-events: none;
            transform: translateY(10px);
            transition: opacity 0.45s ease, transform 0.45s ease;
        }

        .embed-shell.embed-visible iframe {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0);
        }

        .embed-loading {
            position: absolute;
            inset: 0;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            color: #b8c0c8;
            background: #000000;
            font-size: 9px;
            letter-spacing: 1px;
            text-align: center;
            transition: opacity 0.35s ease, visibility 0s linear 0.35s;
        }

        .embed-loading::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(110deg, transparent 25%, rgba(255, 255, 255, 0.07) 45%, transparent 65%);
            transform: translateX(-100%);
            animation: embed-loading-sweep 1.8s ease-in-out infinite;
        }

        .embed-loading span {
            position: relative;
            z-index: 1;
            animation: embed-loading-pulse 1.8s ease-in-out infinite;
        }

        .embed-shell.embed-visible .embed-loading {
            visibility: hidden;
            opacity: 0;
        }

        @keyframes embed-loading-sweep {
            to { transform: translateX(100%); }
        }

        @keyframes embed-loading-pulse {
            0%, 100% { opacity: 0.45; }
            50% { opacity: 0.9; }
        }

        .embed-error {
            position: absolute;
            inset: 0;
            z-index: 1;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: #000000;
            color: #b8c0c8;
            font-size: 9px;
            letter-spacing: 1px;
            text-align: center;
            padding: 16px;
        }

        .embed-error span {
            color: #b8c0c8;
        }

        .embed-retry {
            padding: 10px 14px;
            border: 2px solid white;
            background: transparent;
            color: white;
            font-family: 'Press Start 2P', cursive;
            font-size: 8px;
            letter-spacing: 1px;
            cursor: pointer;
            transition: background 0.2s ease, color 0.2s ease;
        }

        .embed-retry:hover {
            background: white;
            color: black;
        }

        .embed-error a.embed-fallback-link {
            color: #b8c0c8;
            font-size: 8px;
            letter-spacing: 1px;
            text-decoration: underline;
            text-underline-offset: 3px;
        }

        .embed-error a.embed-fallback-link:hover {
            color: white;
        }

        .embed-shell.embed-failed .embed-error {
            display: flex;
        }

        .embed-shell.embed-failed .embed-loading {
            visibility: hidden;
            opacity: 0;
        }

        .embed-shell.embed-failed .embed-cursor-overlay {
            display: none !important;
            pointer-events: none;
        }

        .steam-widgets.visible,
        .itch-widgets.visible {
            display: flex;
        }

        @media (prefers-reduced-motion: reduce) {
            .embed-shell iframe,
            .embed-loading {
                transition-duration: 0.01ms;
            }

            .embed-loading::before,
            .embed-loading span {
                animation: none;
            }
        }

        .platform-link {
            color: white;
            text-decoration: none;
            background: transparent;
            border: 3px solid white;
            padding: 20px;
            font-size: 16px;
            transition: all 0.3s ease;
            text-align: center;
            min-width: 180px;
            text-transform: uppercase;
            letter-spacing: 2px;
            image-rendering: pixelated;
            position: relative;
            cursor: pointer;
            font-family: 'Press Start 2P', cursive;
        }
        /* Base in same color space as HDR for smooth interpolation (white → HDR white) */
        @supports (color: color(display-p3 1 1 1)) {
            .platform-link {
                color: color(display-p3 1 1 1);
                border-color: color(display-p3 1 1 1);
            }
            .platform-link.active {
                background-color: color(display-p3 1 1 1);
                color: black;
            }
            .platform-link::before {
                border-color: color(display-p3 1 1 1);
            }
            .platform-link:hover {
                background-color: color(display-p3 1 1 1);
            }
        }

        .platform-link.active {
            background: white;
            color: black;
        }

        .platform-link::before {
            content: '';
            position: absolute;
            top: -5px;
            left: -5px;
            right: -5px;
            bottom: -5px;
            border: 2px solid white;
            opacity: 0;
            transition: all 0.3s ease;
        }

        .platform-link:hover::before {
            opacity: 1;
            animation: glow 1.5s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from {
                box-shadow: 0 0 5px rgba(255, 255, 255, 0.5),
                           0 0 10px rgba(255, 255, 255, 0.3);
            }
            to {
                box-shadow: 0 0 8px rgba(255, 255, 255, 0.6),
                           0 0 15px rgba(255, 255, 255, 0.4);
            }
        }

        .platform-link:hover {
            background: white;
            color: black;
            transform: translateY(-5px);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.7);
        }

        /* HDR for Steam/Itch buttons — fill + thin rim both HDR when active/hover */
        .platform-link.active,
        .platform-link:hover {
            dynamic-range-limit: no-limit;
        }
        @supports (color: color(display-p3 1.2 1.2 1.2)) {
            .platform-link.active {
                background-color: color(display-p3 1.6 1.6 1.6) !important;
                border-color: color(display-p3 1.6 1.6 1.6) !important;
                color: black !important;
            }
            .platform-link.active::before { border-color: color(display-p3 4 4 4) !important; transition: all 0.3s ease; }
            .platform-link:hover {
                background-color: color(display-p3 1.6 1.6 1.6) !important;
                border-color: color(display-p3 1.6 1.6 1.6) !important;
                color: black !important;
            }
            .platform-link:hover::before { border-color: color(display-p3 4 4 4) !important; transition: all 0.3s ease; }
        }
        @supports (color: oklab(1.5 0 0)) {
            .platform-link.active { background-color: oklab(1.4 0 0) !important; border-color: oklab(1.4 0 0) !important; }
            .platform-link.active::before { border-color: oklab(2.0 0 0) !important; transition: all 0.3s ease; }
            .platform-link:hover { background-color: oklab(1.4 0 0) !important; border-color: oklab(1.4 0 0) !important; }
            .platform-link:hover::before { border-color: oklab(2.0 0 0) !important; transition: all 0.3s ease; }
        }
        @supports (color: oklch(1.5 0 0)) {
            .platform-link.active { background-color: oklch(1.4 0 0) !important; border-color: oklch(1.4 0 0) !important; }
            .platform-link.active::before { border-color: oklch(2.0 0 0) !important; transition: all 0.3s ease; }
            .platform-link:hover { background-color: oklch(1.4 0 0) !important; border-color: oklch(1.4 0 0) !important; }
            .platform-link:hover::before { border-color: oklch(2.0 0 0) !important; transition: all 0.3s ease; }
        }
        @supports (color: color(srgb-linear 3 3 3)) {
            .platform-link.active { background-color: color(srgb-linear 2 2 2) !important; border-color: color(srgb-linear 2 2 2) !important; }
            .platform-link.active::before { border-color: color(srgb-linear 20 20 20) !important; transition: all 0.3s ease; }
            .platform-link:hover { background-color: color(srgb-linear 2 2 2) !important; border-color: color(srgb-linear 2 2 2) !important; }
            .platform-link:hover::before { border-color: color(srgb-linear 20 20 20) !important; transition: all 0.3s ease; }
        }
        /* HDR glow — rim's box-shadow also HDR when supported (blinding) */
        @supports (color: color(display-p3 4 4 4)) {
            @keyframes glow-hdr {
                from { box-shadow: 0 0 5px color(display-p3 4 4 4), 0 0 10px color(display-p3 4 4 4); }
                to { box-shadow: 0 0 8px color(display-p3 4 4 4), 0 0 15px color(display-p3 4 4 4); }
            }
            .platform-link.active::before,
            .platform-link:hover::before {
                animation: glow-hdr 1.5s ease-in-out infinite alternate !important;
            }
        }
        /* HDR only for rim — keep fill SDR white */

        .blurb {
            text-align: center;
            color: white;
            font-family: 'Press Start 2P', cursive;
            font-size: 18px;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
            animation: pulse 2s ease-in-out infinite;
            margin-bottom: 40px;
            text-decoration: none;
            display: block;
            transition: all 0.3s ease;
        }
        
        .blurb:hover {
            transform: scale(1.1);
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.8);
        }

        .release-status {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .release-status .blurb {
            margin-bottom: 0;
        }

        .coming-soon {
            color: #b8c0c8;
            font-family: 'Press Start 2P', cursive;
            font-size: 11px;
            letter-spacing: 1px;
            text-align: center;
            text-shadow: 0 0 8px rgba(184, 192, 200, 0.5);
        }

        @keyframes pulse {
            0% { opacity: 0.7; }
            50% { opacity: 1; }
            100% { opacity: 0.7; }
        }

        .site-footer {
            padding: 20px 20px 40px;
            text-align: center;
        }

        .site-footer a {
            color: #b8c0c8;
            font-family: 'Press Start 2P', cursive;
            font-size: 10px;
            letter-spacing: 1px;
            text-decoration: none;
            text-transform: lowercase;
            transition: color 0.3s ease, text-shadow 0.3s ease;
        }

        .site-footer a:hover {
            color: white;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.7);
        }

        /* iPhone landscape is wider than 768px. Keep Safari on the page scroller. */
        @media (max-width: 1024px), (hover: none) and (pointer: coarse) {
            body {
                overflow-y: hidden;
            }

            body.content-visible {
                overflow-y: auto;
                -webkit-overflow-scrolling: touch;
            }

            #content-container {
                position: relative;
                top: auto;
                left: auto;
                min-height: 100vh;
                min-height: 100lvh;
                height: auto;
                overflow-y: visible;
                touch-action: pan-y;
            }

            .header-video {
                width: calc(100vw - 40px);
                height: auto;
                aspect-ratio: 16 / 9;
            }

            .buttons-container {
                flex-direction: column;
                gap: 30px;
            }

            .platform-link {
                font-size: 14px;
                padding: 15px;
                min-width: 160px;
            }

            .widgets-container {
                width: 100%;
                transform: none;
            }

            .steam-widgets,
            .itch-widgets {
                width: 100%;
                align-items: center;
            }

            .steam-widgets iframe,
            .itch-widgets iframe {
                width: 100%;
            }

            .steam-widgets iframe {
                max-width: 646px;
            }

            .itch-widgets iframe {
                max-width: 560px;
            }
        }

        /* Blocky RGB cursor: red left, green center, blue right. The white center
           sits one pixel above the color layers. There is no DOM follower. */
        :root {
            --windows-cursor: url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACAAAAAgCAYAAABzenr0AAAAIGNIUk0AAHomAACAhAAA+gAAAIDoAAB1MAAA6mAAADqYAAAXcJy6UTwAAAAGYktHRAAAAAAAAPlDu38AAACQSURBVFjD7ZZBCoAwDAQ3i///crxUqbG2HtpEJAMF2wg7rggCgJYVAgFAVRElweMiSoL1JkKC9sBbgq1DTwk+Dbwk2Bt6SHB0w2qJocBqia03FJGbCwDBRG4NNELFrKlcBBrhyzkFSrjUIm5fQR2OBTW/acCGilcL9H5iyyhcSwP2NU1t4POE/rIlSZIk/2cHS9I1Fe321T4AAAARdEVYdGNvbW1lbnQAYmxvY2t5LWEzc9eBsgAAAABJRU5ErkJggg==") 0 0, auto;
        }

        :root.cursor-variant-b {
            --windows-cursor: url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACAAAAAgCAYAAABzenr0AAAAIGNIUk0AAHomAACAhAAA+gAAAIDoAAB1MAAA6mAAADqYAAAXcJy6UTwAAAAGYktHRAAAAAAAAPlDu38AAACQSURBVFjD7ZZBCoAwDAQ3i///crxUqbG2HtpEJAMF2wg7rggCgJYVAgFAVRElweMiSoL1JkKC9sBbgq1DTwk+Dbwk2Bt6SHB0w2qJocBqia03FJGbCwDBRG4NNELFrKlcBBrhyzkFSrjUIm5fQR2OBTW/acCGilcL9H5iyyhcSwP2NU1t4POE/rIlSZIk/2cHS9I1Fe321T4AAAARdEVYdGNvbW1lbnQAYmxvY2t5LWIzWPrScQAAAABJRU5ErkJggg==") 0 0, auto;
        }

         /* Use the crisp RGB cursor assets for the final native cursor. */
         :root {
             --windows-cursor: url('/assets/windows-3.1-cursor-rgb-a.svg') 0 0, auto;
         }

         :root.cursor-variant-b {
             --windows-cursor: url('/assets/windows-3.1-cursor-rgb-b.svg') 0 0, auto;
         }

         @media (hover: hover) and (pointer: fine) {
            html,
            body,
            body * {
                cursor: var(--windows-cursor) !important;
            }
        }

        .embed-cursor-overlay {
            position: absolute;
            inset: 0;
            z-index: 3;
            display: none;
        }

        @media (hover: hover) and (pointer: fine) {
            .embed-cursor-overlay {
                display: block;
            }
        }

    </style>
</head>

    <script>
        const itchEmbedColors = window.THREEHANDS_ITCH_EMBED_COLORS;
        const EMBED_LOAD_TIMEOUT_MS = 9000;
        const EMBED_MAX_RETRIES = 5;
        const ITCH_THROTTLE_MS = 1800;
        const ITCH_MAX_CONCURRENT = 1;
        const ITCH_BACKOFF_BASE_MS = 2200;
        let itchQueue = [];
        let itchActiveCount = 0;
        let itchQueueTimer = null;
        let itch429PauseUntil = 0;
        const widgetGroups = Array.from(document.querySelectorAll('.steam-widgets, .itch-widgets'));

        function clearEmbedTimeout(frame) {
            if (frame._embedTimeout) {
                clearTimeout(frame._embedTimeout);
                frame._embedTimeout = null;
            }
        }

        function scheduleEmbedTimeout(frame, shell) {
            clearEmbedTimeout(frame);
            frame._embedTimeout = window.setTimeout(function() {
                if (shell.classList.contains('embed-ready') || shell.classList.contains('embed-failed')) return;
                if (!frame.hasAttribute('src')) return;
                handleEmbedStalled(frame, shell);
            }, EMBED_LOAD_TIMEOUT_MS);
        }

        function isItchFrame(frame) {
            return !!frame.closest('.itch-widgets');
        }

        function processItchQueue() {
            if (itchQueue.length === 0) return;
            if (itchActiveCount >= ITCH_MAX_CONCURRENT) return;
            if (Date.now() < itch429PauseUntil) {
                var wait = itch429PauseUntil - Date.now();
                if (!itchQueueTimer) {
                    itchQueueTimer = window.setTimeout(function() {
                        itchQueueTimer = null;
                        processItchQueue();
                    }, wait);
                }
                return;
            }
            var now = Date.now();
            var last = processItchQueue._last || 0;
            var delay = Math.max(0, ITCH_THROTTLE_MS - (now - last));
            if (delay > 0) {
                if (!itchQueueTimer) {
                    itchQueueTimer = window.setTimeout(function() {
                        itchQueueTimer = null;
                        processItchQueue();
                    }, delay);
                }
                return;
            }
            var frame = itchQueue.shift();
            if (!frame || frame.hasAttribute('src') || !frame.dataset.src) {
                window.setTimeout(processItchQueue, 0);
                return;
            }
            var shell = frame.closest('.embed-shell');
            if (!shell || shell.classList.contains('embed-ready') || (shell.classList.contains('embed-failed') && parseInt(frame.dataset.embedRetry || '0', 10) >= EMBED_MAX_RETRIES)) {
                window.setTimeout(processItchQueue, 0);
                return;
            }
            itchActiveCount++;
            processItchQueue._last = Date.now();
            shell.classList.remove('embed-failed');
            try { frame.loading = 'eager'; } catch (_e) {}
            frame.src = frame.dataset.src;
            shell.dataset.embedState = 'loading';
            scheduleEmbedTimeout(frame, shell);
            var onDone = function() {
                itchActiveCount = Math.max(0, itchActiveCount - 1);
                frame.removeEventListener('load', onDone);
                frame.removeEventListener('error', onDone);
                window.setTimeout(processItchQueue, ITCH_THROTTLE_MS);
            };
            frame.addEventListener('load', onDone);
            frame.addEventListener('error', onDone);
            if (itchQueue.length) {
                window.setTimeout(processItchQueue, ITCH_THROTTLE_MS);
            }
        }

        function enqueueItchLoad(frame) {
            if (!frame.dataset.src || frame.hasAttribute('src')) return;
            if (itchQueue.indexOf(frame) !== -1) return;
            var shell = frame.closest('.embed-shell');
            if (!shell || shell.classList.contains('embed-ready')) return;
            if (shell.classList.contains('embed-failed') && parseInt(frame.dataset.embedRetry || '0', 10) >= EMBED_MAX_RETRIES) return;
            itchQueue.push(frame);
            processItchQueue();
        }

        function handleEmbedStalled(frame, shell) {
            var retries = parseInt(frame.dataset.embedRetry || '0', 10);
            var isItch = isItchFrame(frame);
            // Itch 429 — exponential backoff with jitter, and global pause
            var backoff = isItch ? (ITCH_BACKOFF_BASE_MS * Math.pow(2, retries) + Math.random() * 700) : (400 * (retries + 1));
            if (isItch) { itch429PauseUntil = Date.now() + backoff + 800; }
            if (retries < EMBED_MAX_RETRIES) {
                frame.dataset.embedRetry = String(retries + 1);
                var source = frame.dataset.src || frame.getAttribute('src');
                if (!source) {
                    markEmbedFailed(shell, frame);
                    if (isItch) { itchActiveCount = Math.max(0, itchActiveCount - 1); window.setTimeout(processItchQueue, ITCH_THROTTLE_MS); }
                    return;
                }
                frame.dataset.src = source;
                frame.removeAttribute('src');
                shell.classList.remove('embed-ready');
                // For itch, re-queue with backoff; for others immediate
                if (isItch) {
                    itchActiveCount = Math.max(0, itchActiveCount - 1);
                    window.setTimeout(function() {
                        enqueueItchLoad(frame);
                    }, backoff);
                    window.setTimeout(processItchQueue, backoff);
                } else {
                    window.setTimeout(function() {
                        startEmbedLoad(frame);
                    }, backoff);
                }
            } else {
                markEmbedFailed(shell, frame);
                if (isItch) { itchActiveCount = Math.max(0, itchActiveCount - 1); window.setTimeout(processItchQueue, ITCH_THROTTLE_MS); }
            }
        }

        function markEmbedReady(shell, frame, index) {
            clearEmbedTimeout(frame);
            shell.classList.remove('embed-failed');
            if (shell.classList.contains('embed-ready')) return;
            shell.classList.add('embed-ready');
            frame.removeAttribute('tabindex');
            const group = shell.closest('.steam-widgets, .itch-widgets');
            if (group && group.classList.contains('visible')) {
                window.setTimeout(function() {
                    if (group.classList.contains('visible') && shell.classList.contains('embed-ready')) {
                        shell.classList.add('embed-visible');
                    }
                }, Math.min(index, 5) * 80);
            }
        }

        function markEmbedFailed(shell, frame) {
            clearEmbedTimeout(frame);
            shell.classList.remove('embed-ready');
            shell.classList.add('embed-failed');
            shell.classList.remove('embed-visible');
            frame.setAttribute('tabindex', '-1');
        }

        function startEmbedLoad(frame) {
            if (frame.hasAttribute('src')) return;
            if (!frame.dataset.src) return;
            const shell = frame.closest('.embed-shell');
            if (!shell) return;
            if (shell.classList.contains('embed-ready')) return;
            if (shell.classList.contains('embed-failed') && parseInt(frame.dataset.embedRetry || '0', 10) >= EMBED_MAX_RETRIES) return;
            if (embedLoadObserver) embedLoadObserver.unobserve(shell);
            // Same-origin static itch embeds — no rate limit needed (was for itch.io 429)
            shell.classList.remove('embed-failed');
            try { frame.loading = 'eager'; } catch (_e) {}
            frame.src = frame.dataset.src;
            shell.dataset.embedState = 'loading';
            scheduleEmbedTimeout(frame, shell);
        }

        function setItchEmbedSources() {
            document.querySelectorAll('.itch-widgets iframe[data-itch-id]').forEach(function(frame) {
                if (frame.dataset.src || frame.hasAttribute('src')) return;
                const gameId = frame.dataset.itchId;
                // Airtight: use same-origin static embeds generated at build time — no visitor-time itch.io request, so no 429
                // Generated by .build/tools/generate_itch_embeds (via thumbnails + colors)
                var source = new URL('/assets/itch-embeds/' + gameId + '.html', window.location.origin);
                // Keep colors for cache-bust / future use, but static page already styled
                var colors = itchEmbedColors && itchEmbedColors[gameId];
                if (colors && /^[0-9A-F]{6}$/.test(colors.fg) && /^[0-9A-F]{6}$/.test(colors.link)) {
                    source.search = new URLSearchParams({
                        fg: colors.fg,
                        link: colors.link
                    }).toString();
                }

                frame.dataset.src = source.href;
            });
        }

        const embedLoadObserver = 'IntersectionObserver' in window
            ? new IntersectionObserver(function(entries, observer) {
                entries.forEach(function(entry) {
                    if (!entry.isIntersecting) return;
                    const frame = entry.target.querySelector('iframe[data-src]');
                    if (frame) startEmbedLoad(frame);
                    observer.unobserve(entry.target);
                });
            }, { rootMargin: '200px 0px' })
            : null;

        function observeLazyEmbeds(group) {
            const pending = Array.from(group.querySelectorAll('iframe[data-src]:not([src])'));
            if (!pending.length) return;
            pending.forEach(function(frame) {
                var isItch = isItchFrame(frame);
                var isPriority = frame.dataset._wasEager === 'true' || frame.loading !== 'lazy';
                if (isPriority && group.classList.contains('visible')) {
                    startEmbedLoad(frame);
                    return;
                }
                if (isItch) {
                    // Intelligent autoload for itch — throttled queue + viewport, not click-to-load
                    if (embedLoadObserver) {
                        embedLoadObserver.observe(frame.closest('.embed-shell'));
                        window.setTimeout(function() {
                            if (!frame.hasAttribute('src') && group.classList.contains('visible') && !frame.closest('.embed-shell').classList.contains('embed-failed')) {
                                var rect = frame.closest('.embed-shell').getBoundingClientRect();
                                var inViewport = rect.top < window.innerHeight + 250 && rect.bottom > -250;
                                if (inViewport) startEmbedLoad(frame);
                            }
                        }, 1200);
                    } else {
                        startEmbedLoad(frame);
                    }
                    return;
                }
                if (embedLoadObserver) {
                    embedLoadObserver.observe(frame.closest('.embed-shell'));
                    window.setTimeout(function() {
                        if (!frame.hasAttribute('src') && group.classList.contains('visible') && !frame.closest('.embed-shell').classList.contains('embed-failed')) {
                            const rect = frame.closest('.embed-shell').getBoundingClientRect();
                            const inViewport = rect.top < window.innerHeight + 250 && rect.bottom > -250;
                            if (inViewport) startEmbedLoad(frame);
                        }
                    }, 1200);
                } else {
                    startEmbedLoad(frame);
                }
            });
        }

        function revealReadyEmbeds(group) {
            const readyShells = Array.from(group.querySelectorAll('.embed-shell.embed-ready'));

            readyShells.forEach(function(shell, index) {
                window.setTimeout(function() {
                    if (group.classList.contains('visible') && shell.classList.contains('embed-ready')) {
                        shell.classList.add('embed-visible');
                    }
                }, Math.min(index, 5) * 80);
            });
        }

        widgetGroups.forEach(function(group) {
            const provider = group.classList.contains('steam-widgets') ? 'Steam' : 'itch.io';

            Array.from(group.querySelectorAll('iframe')).forEach(function(frame, index) {
                const initialSrc = frame.getAttribute('src');
                const alreadyLoaded = frame.dataset.embedLoaded === 'true' && !!initialSrc;
                const isEager = !!initialSrc && frame.loading !== 'lazy' && !alreadyLoaded;
                if (isEager) {
                    frame.dataset.src = initialSrc;
                    frame.removeAttribute('src');
                    frame.dataset._wasEager = 'true';
                }

                let fallbackHref = '';
                let fallbackLabel = '';
                const fallbackAnchor = frame.querySelector('a');
                if (fallbackAnchor) {
                    fallbackHref = fallbackAnchor.getAttribute('href') || fallbackAnchor.href || '';
                    fallbackLabel = (fallbackAnchor.textContent || '').trim();
                }
                if (!fallbackHref && frame.dataset.itchId) {
                    const htmlFallback = frame.innerHTML || '';
                    const match = htmlFallback.match(/href\s*=\s*["']([^"']+)["']/i);
                    if (match) fallbackHref = match[1];
                }

                const shell = document.createElement('div');
                const loader = document.createElement('div');
                const loaderText = document.createElement('span');
                const error = document.createElement('div');
                const errorText = document.createElement('span');
                const retryButton = document.createElement('button');

                shell.className = 'embed-shell';
                shell.dataset.embedIndex = String(index);
                loader.className = 'embed-loading';
                loader.setAttribute('aria-hidden', 'true');
                loaderText.textContent = 'LOADING ' + provider.toUpperCase() + '...';
                loader.appendChild(loaderText);

                error.className = 'embed-error';
                error.setAttribute('aria-hidden', 'true');
                errorText.textContent = provider.toUpperCase() + ' FAILED TO LOAD';
                retryButton.className = 'embed-retry';
                retryButton.type = 'button';
                retryButton.textContent = 'RETRY';
                error.appendChild(errorText);
                error.appendChild(retryButton);
                if (fallbackHref) {
                    const fallbackLink = document.createElement('a');
                    fallbackLink.className = 'embed-fallback-link';
                    fallbackLink.href = fallbackHref;
                    fallbackLink.target = '_blank';
                    fallbackLink.rel = 'noopener';
                    fallbackLink.textContent = fallbackLabel ? 'OPEN ' + fallbackLabel.split(' by ')[0].toUpperCase() : 'OPEN ON ' + provider.toUpperCase();
                    error.appendChild(fallbackLink);
                }

                frame.before(shell);
                shell.appendChild(frame);
                shell.appendChild(loader);
                shell.appendChild(error);

                // Keep the Windows cursor over cross-origin frames.
                // The iframe's document controls its own cursor, so we cover it with a same-origin link that shows the custom cursor and forwards clicks.
                let overlayHref = null;
                let overlayLabel = null;

                // Iframes are raw-text elements, so the no-JS fallback anchor is only in innerHTML.
                const fallbackMatch = frame.innerHTML.match(/href="([^"]+)"/i);
                if (fallbackMatch) {
                    overlayHref = fallbackMatch[1];
                    const labelMatch = frame.innerHTML.match(/<a[^>]*>([\s\S]*?)<\/a>/i);
                    overlayLabel = (labelMatch ? labelMatch[1].trim() : '') || overlayHref;
                } else {
                    const frameSource = frame.src || frame.dataset.src || '';
                    if (frameSource.indexOf('store.steampowered.com/widget/') !== -1) {
                        const match = frameSource.match(/widget\/(\d+)/);
                        if (match) {
                            overlayHref = 'https://store.steampowered.com/app/' + match[1] + '/';
                            overlayLabel = 'Open Steam store page ' + match[1];
                        }
                    } else if (frameSource.indexOf('itch.io/embed/') !== -1) {
                        const match = frameSource.match(/embed\/(\d+)/);
                        if (match) {
                            overlayHref = 'https://itch.io/embed/' + match[1];
                            overlayLabel = 'Open itch.io embed ' + match[1];
                        }
                    }
                }

                const cursorOverlay = document.createElement(overlayHref ? 'a' : 'div');
                cursorOverlay.className = 'embed-cursor-overlay';
                if (overlayHref) {
                    cursorOverlay.href = overlayHref;
                    cursorOverlay.target = '_blank';
                    cursorOverlay.rel = 'noopener';
                    cursorOverlay.setAttribute('aria-label', overlayLabel);
                } else {
                    cursorOverlay.setAttribute('aria-hidden', 'true');
                }
                shell.appendChild(cursorOverlay);

                frame.setAttribute('tabindex', '-1');
                frame.dataset.embedRetry = '0';

                function onReady() {
                    markEmbedReady(shell, frame, index);
                }

                function onStalledOrError() {
                    handleEmbedStalled(frame, shell);
                }

                retryButton.addEventListener('click', function() {
                    shell.classList.remove('embed-failed');
                    frame.dataset.embedRetry = '0';
                    if (!frame.dataset.src && frame.getAttribute('src')) {
                        frame.dataset.src = frame.getAttribute('src');
                    }
                    frame.removeAttribute('src');
                    window.setTimeout(function() {
                        startEmbedLoad(frame);
                    }, 150);
                });

                frame.addEventListener('load', function() {
                    if (!frame.hasAttribute('src')) return;
                    if (frame.dataset.embedLoaded === 'true' && shell.classList.contains('embed-ready')) return;
                    onReady();
                });

                frame.addEventListener('error', function() {
                    onStalledOrError();
                });

                if (frame.dataset.embedLoaded === 'true' && frame.hasAttribute('src')) {
                    onReady();
                }
            });
        });

        setItchEmbedSources();

        // Chromium can keep a stale cursor after a window or tab return.
        // Swap between two visually identical but byte-distinct cursors to force a refresh.
        // This variant reasserts aggressively on every return event and on mouse moves.
        if (window.matchMedia('(hover: hover) and (pointer: fine)').matches) {
            (function() {
                const root = document.documentElement;
                let variantB = false;
                let lastRefresh = 0;

                function refreshCursor() {
                    const now = Date.now();
                    if (now - lastRefresh < 80) return;
                    lastRefresh = now;
                    variantB = !variantB;
                    root.classList.toggle('cursor-variant-b', variantB);
                }

                document.documentElement.addEventListener('mouseenter', refreshCursor);
                document.addEventListener('mousemove', refreshCursor, { passive: true });
                document.addEventListener('visibilitychange', function() {
                    if (!document.hidden) refreshCursor();
                });
                window.addEventListener('focus', refreshCursor);
                window.addEventListener('pageshow', refreshCursor);
                window.addEventListener('blur', function() {
                    // Mark for refresh on next enter
                    lastRefresh = 0;
                });
                refreshCursor();
            })();
        }

        document.addEventListener('DOMContentLoaded', function() {
            const video = document.getElementById('intro-video');
            const videoContainer = document.getElementById('video-container');
            const contentContainer = document.getElementById('content-container');
            const widgetsContainer = document.querySelector('.widgets-container');
            const platformButtons = document.querySelectorAll('button.platform-link');
            const headerVideo = document.querySelector('.header-video');
            const skleshTrailer = document.getElementById('sklesh-trailer');
            const skleshTrailerSource = 'https://video.akamai.steamstatic.com/store_trailers/4617070/1487669050/ee5ce0cfddebaaa617dc21e62fb7ca8700fdf8cc/1776811423/hls_264_master.m3u8?t=1776816847';
            let introState = 'pending';
            let introPlayAttempted = false;
            let contentVisible = false;
            let skleshHls = null;
            let skleshTrailerInitialized = false;
            
            if (window.matchMedia('(dynamic-range: high)').matches) {
                video.src = 'introHDR.mp4';
                headerVideo.src = 'headerHDR.mp4';
            } else {
                video.src = 'introSDR.mp4';
                headerVideo.src = 'headerSDR.mp4';
            }

            function showContent() {
                if (contentVisible) return;
                contentVisible = true;
                document.body.classList.add('content-visible');
                videoContainer.classList.add('hidden');
                contentContainer.classList.add('visible');

                const headerPlayback = headerVideo.play();
                if (headerPlayback !== undefined) {
                    headerPlayback.catch(function() {});
                }

                initializeSkleshTrailer();
            }

            function markIntroPlaying() {
                if (introState === 'pending') {
                    introState = 'playing';
                }
            }

            function showAutoplayFallback(error) {
                if (error && error.name === 'AbortError') return;
                if (introState !== 'pending') return;
                introState = 'fallback';
                showContent();
            }

            function startVideo() {
                if (introPlayAttempted || introState !== 'pending') return;
                introPlayAttempted = true;

                let introPlayback;
                try {
                    introPlayback = video.play();
                } catch (error) {
                    showAutoplayFallback(error);
                    return;
                }

                if (introPlayback !== undefined) {
                    introPlayback.then(markIntroPlaying).catch(showAutoplayFallback);
                }
            }

            function startSkleshTrailer() {
                skleshTrailer.muted = true;
                skleshTrailer.controls = false;
                let trailerPlayback;

                try {
                    trailerPlayback = skleshTrailer.play();
                } catch (_error) {
                    skleshTrailer.controls = true;
                    return;
                }

                if (trailerPlayback !== undefined) {
                    trailerPlayback.catch(function() {
                        skleshTrailer.controls = true;
                    });
                }
            }

            function initializeSkleshTrailer() {
                if (skleshTrailerInitialized) return;
                skleshTrailerInitialized = true;

                if (window.Hls && Hls.isSupported()) {
                    skleshHls = new Hls({
                        capLevelToPlayerSize: true,
                        ignoreDevicePixelRatio: true,
                        startLevel: 0,
                        maxBufferLength: 10,
                        maxMaxBufferLength: 20,
                        maxBufferSize: 8000000,
                        backBufferLength: 5
                    });
                    skleshHls.on(Hls.Events.MANIFEST_PARSED, startSkleshTrailer);
                    skleshHls.loadSource(skleshTrailerSource);
                    skleshHls.attachMedia(skleshTrailer);
                    skleshHls.on(Hls.Events.ERROR, function(_event, data) {
                        if (!data.fatal) return;
                        if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
                            skleshHls.recoverMediaError();
                        } else {
                            skleshHls.destroy();
                            skleshHls = null;
                        }
                    });
                } else if (skleshTrailer.canPlayType('application/vnd.apple.mpegurl')) {
                    skleshTrailer.src = skleshTrailerSource;
                    startSkleshTrailer();
                }
            }

            function showPlatformWidgets(platform) {
                const steamWidgets = document.querySelector('.steam-widgets');
                const itchWidgets = document.querySelector('.itch-widgets');
                
                // Reset all buttons
                platformButtons.forEach(btn => btn.classList.remove('active'));
                
                // Hide all widgets first
                steamWidgets.classList.remove('visible');
                itchWidgets.classList.remove('visible');
                widgetGroups.forEach(function(group) {
                    group.querySelectorAll('.embed-shell').forEach(function(shell) {
                        shell.classList.remove('embed-visible');
                    });
                });
                
                // Show selected platform widgets
                if (platform === 'steam') {
                    steamWidgets.classList.add('visible');
                    document.querySelector('[data-platform="steam"]').classList.add('active');
                    window.requestAnimationFrame(function() {
                        window.requestAnimationFrame(function() {
                            observeLazyEmbeds(steamWidgets);
                            revealReadyEmbeds(steamWidgets);
                        });
                    });
                } else if (platform === 'itch') {
                    itchWidgets.classList.add('visible');
                    document.querySelector('[data-platform="itch"]').classList.add('active');
                    window.requestAnimationFrame(function() {
                        window.requestAnimationFrame(function() {
                            observeLazyEmbeds(itchWidgets);
                            revealReadyEmbeds(itchWidgets);
                        });
                    });
                }
                
                // Show widgets container
                widgetsContainer.classList.add('visible');
            }

            // Add click event listeners to platform buttons
            platformButtons.forEach(button => {
                button.addEventListener('click', () => {
                    showPlatformWidgets(button.dataset.platform);
                });
            });

            video.addEventListener('playing', markIntroPlaying, { once: true });
            video.addEventListener('loadedmetadata', startVideo, { once: true });

            video.addEventListener('ended', showContent);
            video.addEventListener('error', function() {
                if (!video.error || video.error.code !== 1) {
                    introState = 'fallback';
                    showContent();
                }
            });

            if (video.readyState >= HTMLMediaElement.HAVE_METADATA) {
                startVideo();
            }
        });
