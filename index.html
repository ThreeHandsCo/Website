<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Three Hands Co</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <script>
        document.addEventListener('load', function(event) {
            if (event.target instanceof HTMLIFrameElement && event.target.hasAttribute('src')) {
                event.target.dataset.embedLoaded = 'true';
            }
        }, true);
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/hls.js@1.6.16/dist/hls.min.js" integrity="sha384-5E8B0pTlZZJMabWpC0fyYf6OUpe15jJij34BqBAh4NXoHAlLNOjCPRrwtOXOQFAn" crossorigin="anonymous"></script>
    <script src="/assets/itch-embed-colors.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            min-height: 100%;
            background: black;
            dynamic-range-limit: no-limit;
        }
        
        body {
            background: black;
            min-height: 100vh;
            min-height: 100lvh;
            overflow-x: hidden;
            font-family: 'Press Start 2P', cursive;
        }

        #video-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            height: 100lvh;
            z-index: 1;
            opacity: 1;
            transition: opacity 0.5s ease-out;
        }

        #video-container.hidden {
            opacity: 0;
            pointer-events: none;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: black;
        }

        /* Feathered soft edge - vignette into the black page background (no box) */
        #video-container video {
            -webkit-mask-image: radial-gradient(ellipse 125% 90% at 50% 50%, black 0%, black 42%, rgba(0,0,0,0.85) 58%, rgba(0,0,0,0.35) 72%, transparent 88%);
            mask-image: radial-gradient(ellipse 125% 90% at 50% 50%, black 0%, black 42%, rgba(0,0,0,0.85) 58%, rgba(0,0,0,0.35) 72%, transparent 88%);
            -webkit-mask-repeat: no-repeat;
            mask-repeat: no-repeat;
            -webkit-mask-size: 100% 100%;
            mask-size: 100% 100%;
        }

        .header-video {
            width: 400px;
            height: 225px;
            margin-bottom: 40px;
            background: transparent;
            -webkit-mask-image: radial-gradient(ellipse 110% 110% at 50% 50%, black 0%, black 48%, rgba(0,0,0,0.88) 62%, rgba(0,0,0,0.4) 76%, transparent 92%);
            mask-image: radial-gradient(ellipse 110% 110% at 50% 50%, black 0%, black 48%, rgba(0,0,0,0.88) 62%, rgba(0,0,0,0.4) 76%, transparent 92%);
            -webkit-mask-repeat: no-repeat;
            mask-repeat: no-repeat;
            -webkit-mask-size: 100% 100%;
            mask-size: 100% 100%;
        }

        .trailer-wrap {
            position: relative;
            width: min(646px, calc(100vw - 40px));
            aspect-ratio: 16 / 9;
            /* Darker, thinner neumorphic frame — real HDR specular edge */
            isolation: isolate;
            background: #070709;
            border-radius: 14px;
            padding: 5px;
            box-shadow:
                7px 7px 14px rgba(0, 0, 0, 0.96),
                -7px -7px 14px rgba(255, 255, 255, 0.038),
                inset 0 1px 0 rgba(255,255,255,0.04),
                inset 0 -1px 1px rgba(0,0,0,0.55);
        }

        /* HDR shimmering edge — visible, crawling the border */
        .trailer-wrap::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 14px;
            padding: 1.4px;
            background: radial-gradient(ellipse 28% 32% at var(--bezel-x, 18%) var(--bezel-y, 18%), color(srgb-linear 32 32 32) 0%, color(srgb-linear 12 12 12) 18%, color(srgb-linear 4 4 4) 32%, transparent 62%);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask-composite: exclude;
            pointer-events: none;
            opacity: var(--bezel-specular, 0.92);
            mix-blend-mode: screen;
            will-change: opacity, background;
        }

        .trailer-wrap::after {
            content: "";
            position: absolute;
            inset: 1px;
            border-radius: 13px;
            background: linear-gradient(145deg, rgba(255,255,255,0.055) 0%, transparent 42%);
            pointer-events: none;
            opacity: 0.7;
        }

        .featured-trailer {
            display: block;
            position: relative;
            z-index: 1;
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: transparent;
            border-radius: 10px;
            overflow: hidden;
            -webkit-mask-image: radial-gradient(ellipse 110% 105% at 50% 50%, black 0%, black 45%, rgba(0,0,0,0.9) 60%, rgba(0,0,0,0.45) 75%, transparent 95%);
            mask-image: radial-gradient(ellipse 110% 105% at 50% 50%, black 0%, black 45%, rgba(0,0,0,0.9) 60%, rgba(0,0,0,0.45) 75%, transparent 95%);
            -webkit-mask-repeat: no-repeat;
            mask-repeat: no-repeat;
            -webkit-mask-size: 100% 100%;
            mask-size: 100% 100%;
        }

        /* Realtime monitor glow: a downsampled copy of the current frame, blurred.
           Painted on three layers - tight bloom + wide spill + outer haze.
           No mask/border — the canvas edge is hidden by blur + dither. */
        .trailer-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            z-index: 0;
            width: 100%;
            height: 100%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            opacity: 0;
            will-change: opacity;
            image-rendering: auto;
        }

        .trailer-glow-tight {
            width: 118%;
            height: 118%;
            filter: blur(56px) saturate(1.5);
        }

        .trailer-glow-wide {
            width: 170%;
            height: 170%;
            filter: blur(130px) saturate(1.5);
        }

        .trailer-glow-outer {
            width: 220%;
            height: 220%;
            filter: blur(190px) saturate(1.5);
        }



        /* Dust motes drifting through the monitor light. Each mote is lit by
           sampling the downsampled frame, so dust only shows where the glow
           actually falls - like dust in a light beam at night. */
        .trailer-dust {
            position: absolute;
            top: 50%;
            left: 50%;
            z-index: 2;
            width: 170%;
            height: 170%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        #content-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            height: 100lvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 40px;
            z-index: 0;
            opacity: 0;
            transition: opacity 0.5s ease-in;
            overflow-y: auto;
            /* The glow bleeds past the viewport edges; clip it without creating
               a horizontal scroll container (body overflow-x: hidden is the
               fallback for browsers without `clip`). */
            overflow-x: clip;
            padding: 40px 0;
            /* Keep in-flow content clear of the dynamic Safari controls. */
            padding:
                calc(40px + env(safe-area-inset-top, 0px))
                env(safe-area-inset-right, 0px)
                calc(40px + max(env(safe-area-inset-bottom, 0px), 24px))
                env(safe-area-inset-left, 0px);
        }

        #content-container.visible {
            opacity: 1;
        }

        .buttons-container {
            display: flex;
            gap: 40px;
            margin-top: 48px;
            margin-bottom: 40px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .widgets-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            opacity: 0;
            transition: opacity 0.3s ease;
            max-width: 100%;
            padding: 0 20px;
            margin-bottom: 40px;
        }

        .widgets-container.visible {
            opacity: 1;
        }

        .steam-widgets,
        .itch-widgets {
            display: none;
            flex-direction: column;
            gap: 20px;
        }

        .steam-widgets {
            width: min(646px, calc(100vw - 40px));
        }

        .itch-widgets {
            width: min(560px, calc(100vw - 40px));
        }

        .embed-shell {
            position: relative;
            width: 100%;
            overflow: hidden;
            background: transparent;
            isolation: isolate;
        }

        .steam-widgets .embed-shell {
            max-width: 646px;
            height: 190px;
        }

        .itch-widgets .embed-shell {
            max-width: 560px;
            height: 175px;
        }

        @media (max-width: 600px) {
            .itch-widgets .embed-shell {
                height: 158px;
            }
        }

        .embed-shell iframe {
            position: absolute;
            inset: 0;
            z-index: 2;
            display: block;
            width: 100%;
            height: 100%;
            opacity: 0;
            pointer-events: none;
            transform: scale(0.98);
            will-change: opacity, transform, mask-position;
            /* Diagonal gradient wipe: hidden until the reveal mask sweeps across. */
            -webkit-mask-image: linear-gradient(115deg, transparent 0%, black 28%, black 100%);
            mask-image: linear-gradient(115deg, transparent 0%, black 28%, black 100%);
            -webkit-mask-size: 250% 100%;
            mask-size: 250% 100%;
            -webkit-mask-repeat: no-repeat;
            mask-repeat: no-repeat;
            -webkit-mask-position: -100% 0;
            mask-position: -100% 0;
            transition: opacity 0.2s ease,
                transform 0.65s cubic-bezier(0.22, 1, 0.36, 1),
                -webkit-mask-position 0.65s cubic-bezier(0.22, 1, 0.36, 1),
                mask-position 0.65s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .embed-shell.embed-visible iframe {
            opacity: 1;
            pointer-events: auto;
            transform: scale(1);
            /* End past the ramp so the wipe edge fully leaves the frame. */
            -webkit-mask-position: 50% 0;
            mask-position: 50% 0;
        }

        .embed-loading {
            position: absolute;
            inset: 0;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            color: #b8c0c8;
            background: #000000;
            font-size: 9px;
            letter-spacing: 1px;
            text-align: center;
            transition: opacity 0.35s ease, visibility 0s linear 0.35s;
        }

        .embed-loading::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(110deg, transparent 25%, rgba(255, 255, 255, 0.07) 45%, transparent 65%);
            transform: translateX(-100%);
            animation: embed-loading-sweep 1.8s ease-in-out infinite;
        }

        .embed-loading span {
            position: relative;
            z-index: 1;
            animation: embed-loading-pulse 1.8s ease-in-out infinite;
        }

        .embed-shell.embed-visible .embed-loading {
            visibility: hidden;
            opacity: 0;
        }

        @keyframes embed-loading-sweep {
            to { transform: translateX(100%); }
        }

        @keyframes embed-loading-pulse {
            0%, 100% { opacity: 0.45; }
            50% { opacity: 0.9; }
        }

        .embed-error {
            position: absolute;
            inset: 0;
            z-index: 1;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: #000000;
            color: #b8c0c8;
            font-size: 9px;
            letter-spacing: 1px;
            text-align: center;
            padding: 16px;
        }

        .embed-error span {
            color: #b8c0c8;
        }

        .embed-retry {
            padding: 10px 14px;
            border: 2px solid white;
            background: transparent;
            color: white;
            font-family: 'Press Start 2P', cursive;
            font-size: 8px;
            letter-spacing: 1px;
            cursor: pointer;
            transition: background 0.2s ease, color 0.2s ease;
        }

        .embed-retry:hover {
            background: white;
            color: black;
        }

        .embed-error a.embed-fallback-link {
            color: #b8c0c8;
            font-size: 8px;
            letter-spacing: 1px;
            text-decoration: underline;
            text-underline-offset: 3px;
        }

        .embed-error a.embed-fallback-link:hover {
            color: white;
        }

        .embed-shell.embed-failed .embed-error {
            display: flex;
        }

        .embed-shell.embed-failed .embed-loading {
            visibility: hidden;
            opacity: 0;
        }

        .embed-shell.embed-failed .embed-cursor-overlay {
            display: none !important;
            pointer-events: none;
        }

        .steam-widgets.visible,
        .itch-widgets.visible {
            display: flex;
        }

        @media (prefers-reduced-motion: reduce) {
            .embed-shell iframe {
                transform: none;
                -webkit-mask-position: 50% 0;
                mask-position: 50% 0;
                transition: opacity 0.25s ease;
            }

            .embed-loading {
                transition-duration: 0.01ms;
            }

            .embed-loading::before,
            .embed-loading span {
                animation: none;
            }
        }

        /* Neumorphic — soft UI: same hue as the page, depth from paired
           dark/light shadows. Feels pressed from the black, not floating
           on it. Keeps the pixel font but makes the surface tactile. */
        .platform-link {
            color: #7f868e;
            text-decoration: none;
            background: #0e0e0e;
            border: none;
            border-radius: 18px;
            padding: 20px 26px;
            font-size: 13px;
            line-height: 1.35;
            text-align: center;
            min-width: 180px;
            text-transform: uppercase;
            letter-spacing: 1.6px;
            image-rendering: auto;
            position: relative;
            cursor: pointer;
            font-family: 'Press Start 2P', cursive;
            /* darker matte decal — no text glow, just top highlight + deboss */
            text-shadow: 0 -0.35px 0.35px rgba(255,255,255,0.07), 0 1px 0 rgba(0,0,0,0.68), 0 2px 6px rgba(0,0,0,0.42);
            opacity: 0.90;
            filter: contrast(0.97) brightness(0.78) sepia(0.02);
            /* extruded: dark shadow + highlight edge, same base as page.
               A crisp 1px top light + 1px bottom dark makes the boundary read. */
            box-shadow:
                9px 9px 18px rgba(0, 0, 0, 0.96),
                -9px -9px 18px var(--btn-edge, rgba(255, 255, 255, 0.09)),
                inset 0 1px 0 rgba(255, 255, 255, 0.08),
                inset 0 -1px 1px rgba(0, 0, 0, 0.6);
            transition:
                box-shadow 0.22s cubic-bezier(0.2, 0.8, 0.2, 1),
                transform 0.22s cubic-bezier(0.2, 0.8, 0.2, 1),
                color 0.2s ease, background 0.2s ease, filter 0.2s ease;
            dynamic-range-limit: no-limit;
        }

        /* per-button decal jitter — not distracting, just not laser-perfect */
        .platform-link:nth-child(1) { --rot: -0.14deg; letter-spacing: 1.55px; }
        .platform-link:nth-child(2) { --rot: 0.11deg; letter-spacing: 1.68px; }
        .platform-link:nth-child(3) { --rot: -0.07deg; letter-spacing: 1.58px; }
        .platform-link { transform: rotate(var(--rot, 0deg)); }

        /* popped-out specular — brighter HDR, 1-2px at true peak, video-driven.
           The full gradient is swapped per button so the shimmer carries the
           color of the frame region above that button. */
        .platform-link::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 18px;
            padding: 2px;
            background: var(--btn-spec-bg, radial-gradient(ellipse 30% 38% at var(--btn-spec-x, 22%) var(--btn-spec-y, 20%), color(srgb-linear 60 60 60) 0%, color(srgb-linear 22 22 22) 18%, color(srgb-linear 8 8 8) 32%, transparent 62%));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask-composite: exclude;
            pointer-events: none;
            opacity: var(--btn-specular, 0);
            mix-blend-mode: screen;
            will-change: opacity;
        }
        .platform-link.active::before,
        .platform-link:active::before {
            opacity: 0 !important;
        }

        /* real-button age: ultra-subtle grain + decal misregister, not distracting */
        .platform-link::after {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 18px;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.92' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.045'/%3E%3C/svg%3E");
            opacity: 0.38;
            mix-blend-mode: overlay;
            pointer-events: none;
        }

        .platform-link:hover {
            transform: rotate(var(--rot, 0deg)) translateY(-2px);
            color: #8e949c;
            text-shadow: 0 -0.35px 0.35px rgba(255,255,255,0.07), 0 1px 0 rgba(0,0,0,0.64);
            filter: brightness(0.92);
            box-shadow:
                11px 11px 22px rgba(0, 0, 0, 0.98),
                -11px -11px 22px var(--btn-edge, rgba(255, 255, 255, 0.11)),
                inset 0 1px 0 rgba(255, 255, 255, 0.10),
                inset 0 -1px 1px rgba(0, 0, 0, 0.6);
        }

        .platform-link:active,
        .platform-link.active {
            background: #0a0a0a;
            color: #6f767e;
            /* pressed ink, not emissive — dimmer, debossed */
            text-shadow: 0 1px 0 rgba(0,0,0,0.70), 0 0 0.5px rgba(0,0,0,0.45);
            opacity: 0.82;
            filter: brightness(0.80) contrast(0.96);
            /* pressed / dented — inset shadows, same light direction */
            box-shadow:
                inset 8px 8px 16px rgba(0, 0, 0, 0.96),
                inset -8px -8px 16px rgba(255, 255, 255, 0.045);
            transform: rotate(var(--rot, 0deg)) translateY(1px) scale(0.993);
        }

        .platform-link:focus-visible {
            outline: none;
            box-shadow:
                9px 9px 18px rgba(0, 0, 0, 0.92),
                -9px -9px 18px rgba(255, 255, 255, 0.055),
                0 0 0 2px rgba(255,255,255,0.14);
        }

        .platform-link:disabled {
            opacity: 0.52;
            cursor: not-allowed;
            box-shadow:
                5px 5px 12px rgba(0, 0, 0, 0.62),
                -5px -5px 12px rgba(255, 255, 255, 0.05),
                inset 0 1px 0 rgba(255, 255, 255, 0.05),
                inset 0 -1px 1px rgba(0, 0, 0, 0.55);
            transform: none;
        }

        .platform-link:disabled:hover {
            transform: none;
            box-shadow:
                5px 5px 12px rgba(0, 0, 0, 0.62),
                -5px -5px 12px rgba(255, 255, 255, 0.032);
        }

        .blurb {
            text-align: center;
            color: #d8dde3;
            font-family: 'Press Start 2P', cursive;
            font-size: 18px;
            text-transform: uppercase;
            /* matte, not emissive — top highlight + bottom shadow as if lit from the video above */
            text-shadow: 0 -0.6px 0.6px rgba(255,255,255,0.11), 0 1px 0 rgba(0,0,0,0.62), 0 2px 6px rgba(0,0,0,0.45);
            opacity: 0.94;
            filter: brightness(0.96) contrast(0.98);
            margin-bottom: 40px;
            text-decoration: none;
            display: block;
            /* lit by video — JS drives --blurb-bright and --blurb-tint */
            transition: transform 0.22s ease, filter 0.12s linear, color 0.12s linear, text-shadow 0.12s linear, opacity 0.12s linear;
            will-change: filter, color, text-shadow;
        }

        /* Same shimmer as the buttons, mild: gradient-lit glyphs with a
           crawling specular streak JS positions on the video's bright spot. */
        @supports ((-webkit-background-clip: text) or (background-clip: text)) {
            .blurb {
                background-image: var(--blurb-sheen, linear-gradient(180deg, #d8dde3 0%, #d8dde3 100%));
                background-size: 100% 100%;
                background-repeat: no-repeat;
                -webkit-background-clip: text;
                background-clip: text;
                -webkit-text-fill-color: transparent;
            }
        }
        
        .blurb:hover {
            transform: scale(1.04);
            filter: brightness(1.02);
        }

        .release-status {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .release-status .blurb {
            margin-bottom: 0;
        }

        .coming-soon {
            color: #e0e5ea;
            font-family: 'Press Start 2P', cursive;
            font-size: 11px;
            letter-spacing: 1px;
            text-align: center;
            /* same light field, weaker — further from the video */
            text-shadow: 0 -0.4px 0.4px rgba(255,255,255,0.14), 0 1px 0 rgba(0,0,0,0.45);
            opacity: 0.92;
            filter: brightness(1);
            transition: filter 0.12s linear, color 0.12s linear, text-shadow 0.12s linear, opacity 0.12s linear;
            will-change: filter, color;
        }

        @keyframes pulse {
            0% { opacity: 0.7; }
            50% { opacity: 1; }
            100% { opacity: 0.7; }
        }

        .site-footer {
            padding: 20px 20px 40px;
            text-align: center;
        }

        .site-footer a {
            color: #b8c0c8;
            font-family: 'Press Start 2P', cursive;
            font-size: 10px;
            letter-spacing: 1px;
            text-decoration: none;
            text-transform: lowercase;
            transition: color 0.3s ease, text-shadow 0.3s ease;
        }

        .site-footer a:hover {
            color: white;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.7);
        }

        /* iPhone landscape is wider than 768px. Keep Safari on the page scroller. */
        @media (max-width: 1024px), (hover: none) and (pointer: coarse) {
            body {
                overflow-y: hidden;
            }

            body.content-visible {
                overflow-y: auto;
                -webkit-overflow-scrolling: touch;
            }

            #content-container {
                position: relative;
                top: auto;
                left: auto;
                min-height: 100vh;
                min-height: 100lvh;
                height: auto;
                overflow-y: visible;
                touch-action: pan-y;
            }

            .header-video {
                width: calc(100vw - 40px);
                height: auto;
                aspect-ratio: 16 / 9;
            }

            .buttons-container {
                flex-direction: column;
                gap: 30px;
            }

            .platform-link {
                font-size: 14px;
                padding: 15px;
                min-width: 160px;
            }

            .widgets-container {
                width: 100%;
                transform: none;
                gap: 4px;
            }

            .steam-widgets,
            .itch-widgets {
                width: 100%;
                align-items: center;
                gap: 2px;
            }

            .steam-widgets iframe,
            .itch-widgets iframe {
                width: 100%;
            }

            .steam-widgets iframe {
                max-width: 646px;
            }

            .itch-widgets iframe {
                max-width: 560px;
            }
        }

        /* Blocky RGB cursor: red left, green center, blue right. The white center

    <script>
        const itchEmbedColors = window.THREEHANDS_ITCH_EMBED_COLORS;
        const EMBED_LOAD_TIMEOUT_MS = 9000;
        const EMBED_MAX_RETRIES = 5;
        const ITCH_THROTTLE_MS = 1800;
        const ITCH_MAX_CONCURRENT = 1;
        const ITCH_BACKOFF_BASE_MS = 2200;
        const ITCH_EMBED_ASSET_VERSION = 'title-fit-v1';
        let itchQueue = [];
        let itchActiveCount = 0;
        let itchQueueTimer = null;
        let itch429PauseUntil = 0;
        const widgetGroups = Array.from(document.querySelectorAll('.steam-widgets, .itch-widgets'));

        function clearEmbedTimeout(frame) {
            if (frame._embedTimeout) {
                clearTimeout(frame._embedTimeout);
                frame._embedTimeout = null;
            }
        }

        function scheduleEmbedTimeout(frame, shell) {
            clearEmbedTimeout(frame);
            frame._embedTimeout = window.setTimeout(function() {
                if (shell.classList.contains('embed-ready') || shell.classList.contains('embed-failed')) return;
                if (!frame.hasAttribute('src')) return;
                handleEmbedStalled(frame, shell);
            }, EMBED_LOAD_TIMEOUT_MS);
        }

        function isItchFrame(frame) {
            return !!frame.closest('.itch-widgets');
        }

        function processItchQueue() {
            if (itchQueue.length === 0) return;
            if (itchActiveCount >= ITCH_MAX_CONCURRENT) return;
            if (Date.now() < itch429PauseUntil) {
                var wait = itch429PauseUntil - Date.now();
                if (!itchQueueTimer) {
                    itchQueueTimer = window.setTimeout(function() {
                        itchQueueTimer = null;
                        processItchQueue();
                    }, wait);
                }
                return;
            }
            var now = Date.now();
            var last = processItchQueue._last || 0;
            var delay = Math.max(0, ITCH_THROTTLE_MS - (now - last));
            if (delay > 0) {
                if (!itchQueueTimer) {
                    itchQueueTimer = window.setTimeout(function() {
                        itchQueueTimer = null;
                        processItchQueue();
                    }, delay);
                }
                return;
            }
            var frame = itchQueue.shift();
            if (!frame || frame.hasAttribute('src') || !frame.dataset.src) {
                window.setTimeout(processItchQueue, 0);
                return;
            }
            var shell = frame.closest('.embed-shell');
            if (!shell || shell.classList.contains('embed-ready') || (shell.classList.contains('embed-failed') && parseInt(frame.dataset.embedRetry || '0', 10) >= EMBED_MAX_RETRIES)) {
                window.setTimeout(processItchQueue, 0);
                return;
            }
            itchActiveCount++;
            processItchQueue._last = Date.now();
            shell.classList.remove('embed-failed');
            try { frame.loading = 'eager'; } catch (_e) {}
            frame.src = frame.dataset.src;
            shell.dataset.embedState = 'loading';
            scheduleEmbedTimeout(frame, shell);
            var onDone = function() {
                itchActiveCount = Math.max(0, itchActiveCount - 1);
                frame.removeEventListener('load', onDone);
                frame.removeEventListener('error', onDone);
                window.setTimeout(processItchQueue, ITCH_THROTTLE_MS);
            };
            frame.addEventListener('load', onDone);
            frame.addEventListener('error', onDone);
            if (itchQueue.length) {
                window.setTimeout(processItchQueue, ITCH_THROTTLE_MS);
            }
        }

        function enqueueItchLoad(frame) {
            if (!frame.dataset.src || frame.hasAttribute('src')) return;
            if (itchQueue.indexOf(frame) !== -1) return;
            var shell = frame.closest('.embed-shell');
            if (!shell || shell.classList.contains('embed-ready')) return;
            if (shell.classList.contains('embed-failed') && parseInt(frame.dataset.embedRetry || '0', 10) >= EMBED_MAX_RETRIES) return;
            itchQueue.push(frame);
            processItchQueue();
        }

        function handleEmbedStalled(frame, shell) {
            var retries = parseInt(frame.dataset.embedRetry || '0', 10);
            var isItch = isItchFrame(frame);
            // Itch 429 — exponential backoff with jitter, and global pause
            var backoff = isItch ? (ITCH_BACKOFF_BASE_MS * Math.pow(2, retries) + Math.random() * 700) : (400 * (retries + 1));
            if (isItch) { itch429PauseUntil = Date.now() + backoff + 800; }
            if (retries < EMBED_MAX_RETRIES) {
                frame.dataset.embedRetry = String(retries + 1);
                var source = frame.dataset.src || frame.getAttribute('src');
                if (!source) {
                    markEmbedFailed(shell, frame);
                    if (isItch) { itchActiveCount = Math.max(0, itchActiveCount - 1); window.setTimeout(processItchQueue, ITCH_THROTTLE_MS); }
                    return;
                }
                frame.dataset.src = source;
                frame.removeAttribute('src');
                shell.classList.remove('embed-ready');
                // For itch, re-queue with backoff; for others immediate
                if (isItch) {
                    itchActiveCount = Math.max(0, itchActiveCount - 1);
                    window.setTimeout(function() {
                        enqueueItchLoad(frame);
                    }, backoff);
                    window.setTimeout(processItchQueue, backoff);
                } else {
                    window.setTimeout(function() {
                        startEmbedLoad(frame);
                    }, backoff);
                }
            } else {
                markEmbedFailed(shell, frame);
                if (isItch) { itchActiveCount = Math.max(0, itchActiveCount - 1); window.setTimeout(processItchQueue, ITCH_THROTTLE_MS); }
            }
        }

        function markEmbedReady(shell, frame, index) {
            clearEmbedTimeout(frame);
            shell.classList.remove('embed-failed');
            if (shell.classList.contains('embed-ready')) return;
            shell.classList.add('embed-ready');
            frame.removeAttribute('tabindex');
            const group = shell.closest('.steam-widgets, .itch-widgets');
            if (group && group.classList.contains('visible')) {
                window.setTimeout(function() {
                    if (group.classList.contains('visible') && shell.classList.contains('embed-ready')) {
                        shell.classList.add('embed-visible');
                    }
                }, Math.min(index, 5) * 80);
            }
        }

        function markEmbedFailed(shell, frame) {
            clearEmbedTimeout(frame);
            shell.classList.remove('embed-ready');
            shell.classList.add('embed-failed');
            shell.classList.remove('embed-visible');
            frame.setAttribute('tabindex', '-1');
        }

        function startEmbedLoad(frame) {
            if (frame.hasAttribute('src')) return;
            if (!frame.dataset.src) return;
            const shell = frame.closest('.embed-shell');
            if (!shell) return;
            if (shell.classList.contains('embed-ready')) return;
            if (shell.classList.contains('embed-failed') && parseInt(frame.dataset.embedRetry || '0', 10) >= EMBED_MAX_RETRIES) return;
            if (embedLoadObserver) embedLoadObserver.unobserve(shell);
            // Same-origin static itch embeds — no rate limit needed (was for itch.io 429)
            shell.classList.remove('embed-failed');
            try { frame.loading = 'eager'; } catch (_e) {}
            frame.src = frame.dataset.src;
            shell.dataset.embedState = 'loading';
            scheduleEmbedTimeout(frame, shell);
        }

        function setItchEmbedSources() {
            document.querySelectorAll('.itch-widgets iframe[data-itch-id]').forEach(function(frame) {
                if (frame.dataset.src || frame.hasAttribute('src')) return;
                const gameId = frame.dataset.itchId;
                // Airtight: use same-origin static embeds generated at build time — no visitor-time itch.io request, so no 429
                // Generated by .build/tools/generate_itch_embeds (via thumbnails + colors)
                var source = new URL('/assets/itch-embeds/' + gameId + '.html', window.location.origin);
                // Keep colors for cache-bust / future use, but static page already styled
                var colors = itchEmbedColors && itchEmbedColors[gameId];
                if (colors && /^[0-9A-F]{6}$/.test(colors.fg) && /^[0-9A-F]{6}$/.test(colors.link)) {
                    source.search = new URLSearchParams({
                        v: ITCH_EMBED_ASSET_VERSION,
                        fg: colors.fg,
                        link: colors.link
                    }).toString();
                } else {
                    source.search = new URLSearchParams({
                        v: ITCH_EMBED_ASSET_VERSION
                    }).toString();
                }

                frame.dataset.src = source.href;
            });
        }

        const embedLoadObserver = 'IntersectionObserver' in window
            ? new IntersectionObserver(function(entries, observer) {
                entries.forEach(function(entry) {
                    if (!entry.isIntersecting) return;
                    const frame = entry.target.querySelector('iframe[data-src]');
                    if (frame) startEmbedLoad(frame);
                    observer.unobserve(entry.target);
                });
            }, { rootMargin: '200px 0px' })
            : null;

        function observeLazyEmbeds(group) {
            const pending = Array.from(group.querySelectorAll('iframe[data-src]:not([src])'));
            if (!pending.length) return;
            pending.forEach(function(frame) {
                var isItch = isItchFrame(frame);
                var isPriority = frame.dataset._wasEager === 'true' || frame.loading !== 'lazy';
                if (isPriority && group.classList.contains('visible')) {
                    startEmbedLoad(frame);
                    return;
                }
                if (isItch) {
                    // Intelligent autoload for itch — throttled queue + viewport, not click-to-load
                    if (embedLoadObserver) {
                        embedLoadObserver.observe(frame.closest('.embed-shell'));
                        window.setTimeout(function() {
                            if (!frame.hasAttribute('src') && group.classList.contains('visible') && !frame.closest('.embed-shell').classList.contains('embed-failed')) {
                                var rect = frame.closest('.embed-shell').getBoundingClientRect();
                                var inViewport = rect.top < window.innerHeight + 250 && rect.bottom > -250;
                                if (inViewport) startEmbedLoad(frame);
                            }
                        }, 1200);
                    } else {
                        startEmbedLoad(frame);
                    }
                    return;
                }
                if (embedLoadObserver) {
                    embedLoadObserver.observe(frame.closest('.embed-shell'));
                    window.setTimeout(function() {
                        if (!frame.hasAttribute('src') && group.classList.contains('visible') && !frame.closest('.embed-shell').classList.contains('embed-failed')) {
                            const rect = frame.closest('.embed-shell').getBoundingClientRect();
                            const inViewport = rect.top < window.innerHeight + 250 && rect.bottom > -250;
                            if (inViewport) startEmbedLoad(frame);
                        }
                    }, 1200);
                } else {
                    startEmbedLoad(frame);
                }
            });
        }

        function revealReadyEmbeds(group) {
            const readyShells = Array.from(group.querySelectorAll('.embed-shell.embed-ready'));

            readyShells.forEach(function(shell, index) {
                window.setTimeout(function() {
                    if (group.classList.contains('visible') && shell.classList.contains('embed-ready')) {
                        shell.classList.add('embed-visible');
                    }
                }, Math.min(index, 5) * 80);
            });
        }

        widgetGroups.forEach(function(group) {
            const provider = group.classList.contains('steam-widgets') ? 'Steam' : 'itch.io';

            Array.from(group.querySelectorAll('iframe')).forEach(function(frame, index) {
                const initialSrc = frame.getAttribute('src');
                const alreadyLoaded = frame.dataset.embedLoaded === 'true' && !!initialSrc;
                const isEager = !!initialSrc && frame.loading !== 'lazy' && !alreadyLoaded;
                if (isEager) {
                    frame.dataset.src = initialSrc;
                    frame.removeAttribute('src');
                    frame.dataset._wasEager = 'true';
                }

                let fallbackHref = '';
                let fallbackLabel = '';
                const fallbackAnchor = frame.querySelector('a');
                if (fallbackAnchor) {
                    fallbackHref = fallbackAnchor.getAttribute('href') || fallbackAnchor.href || '';
                    fallbackLabel = (fallbackAnchor.textContent || '').trim();
                }
                if (!fallbackHref && frame.dataset.itchId) {
                    const htmlFallback = frame.innerHTML || '';
                    const match = htmlFallback.match(/href\s*=\s*["']([^"']+)["']/i);
                    if (match) fallbackHref = match[1];
                }

                const shell = document.createElement('div');
                const loader = document.createElement('div');
                const loaderText = document.createElement('span');
                const error = document.createElement('div');
                const errorText = document.createElement('span');
                const retryButton = document.createElement('button');

                shell.className = 'embed-shell';
                shell.dataset.embedIndex = String(index);
                loader.className = 'embed-loading';
                loader.setAttribute('aria-hidden', 'true');
                loaderText.textContent = 'LOADING ' + provider.toUpperCase() + '...';
                loader.appendChild(loaderText);

                error.className = 'embed-error';
                error.setAttribute('aria-hidden', 'true');
                errorText.textContent = provider.toUpperCase() + ' FAILED TO LOAD';
                retryButton.className = 'embed-retry';
                retryButton.type = 'button';
                retryButton.textContent = 'RETRY';
                error.appendChild(errorText);
                error.appendChild(retryButton);
                if (fallbackHref) {
                    const fallbackLink = document.createElement('a');
                    fallbackLink.className = 'embed-fallback-link';
                    fallbackLink.href = fallbackHref;
                    fallbackLink.target = '_blank';
                    fallbackLink.rel = 'noopener';
                    fallbackLink.textContent = fallbackLabel ? 'OPEN ' + fallbackLabel.split(' by ')[0].toUpperCase() : 'OPEN ON ' + provider.toUpperCase();
                    error.appendChild(fallbackLink);
                }

                frame.before(shell);
                shell.appendChild(frame);
                shell.appendChild(loader);
                shell.appendChild(error);

                // Keep the Windows cursor over cross-origin frames.
                // The iframe's document controls its own cursor, so we cover it with a same-origin link that shows the custom cursor and forwards clicks.
                let overlayHref = null;
                let overlayLabel = null;

                // Iframes are raw-text elements, so the no-JS fallback anchor is only in innerHTML.
                const fallbackMatch = frame.innerHTML.match(/href="([^"]+)"/i);
                if (fallbackMatch) {
                    overlayHref = fallbackMatch[1];
                    const labelMatch = frame.innerHTML.match(/<a[^>]*>([\s\S]*?)<\/a>/i);
                    overlayLabel = (labelMatch ? labelMatch[1].trim() : '') || overlayHref;
                } else {
                    const frameSource = frame.src || frame.dataset.src || '';
                    if (frameSource.indexOf('store.steampowered.com/widget/') !== -1) {
                        const match = frameSource.match(/widget\/(\d+)/);
                        if (match) {
                            overlayHref = 'https://store.steampowered.com/app/' + match[1] + '/';
                            overlayLabel = 'Open Steam store page ' + match[1];
                        }
                    } else if (frameSource.indexOf('itch.io/embed/') !== -1) {
                        const match = frameSource.match(/embed\/(\d+)/);
                        if (match) {
                            overlayHref = 'https://itch.io/embed/' + match[1];
                            overlayLabel = 'Open itch.io embed ' + match[1];
                        }
                    }
                }

                const cursorOverlay = document.createElement(overlayHref ? 'a' : 'div');
                cursorOverlay.className = 'embed-cursor-overlay';
                if (overlayHref) {
                    cursorOverlay.href = overlayHref;
                    cursorOverlay.target = '_blank';
                    cursorOverlay.rel = 'noopener';
                    cursorOverlay.setAttribute('aria-label', overlayLabel);
                } else {
                    cursorOverlay.setAttribute('aria-hidden', 'true');
                }
                shell.appendChild(cursorOverlay);

                frame.setAttribute('tabindex', '-1');
                frame.dataset.embedRetry = '0';

                function onReady() {
                    markEmbedReady(shell, frame, index);
                }

                function onStalledOrError() {
                    handleEmbedStalled(frame, shell);
                }

                retryButton.addEventListener('click', function() {
                    shell.classList.remove('embed-failed');
                    frame.dataset.embedRetry = '0';
                    if (!frame.dataset.src && frame.getAttribute('src')) {
                        frame.dataset.src = frame.getAttribute('src');
                    }
                    frame.removeAttribute('src');
                    window.setTimeout(function() {
                        startEmbedLoad(frame);
                    }, 150);
                });

                frame.addEventListener('load', function() {
                    if (!frame.hasAttribute('src')) return;
                    if (frame.dataset.embedLoaded === 'true' && shell.classList.contains('embed-ready')) return;
                    onReady();
                });

                frame.addEventListener('error', function() {
                    onStalledOrError();
                });

                if (frame.dataset.embedLoaded === 'true' && frame.hasAttribute('src')) {
                    onReady();
                }
            });
        });

        setItchEmbedSources();

        // Chromium can keep a stale cursor after a window or tab return.
        // Swap between two visually identical but byte-distinct cursors to force a refresh.
        // Always apply - no hover/pointer media query gate.

                    blurbEl.style.color = `rgb(${baseR},${baseG},${baseB})`;
                    blurbEl.style.textShadow = `${top}, ${bottom}, ${hdrGlow}`;
                    blurbEl.style.filter = `brightness(${0.94 + 0.24*avgL*flick*glowFade}) contrast(0.99)`;

                        comingEl.style.filter = `brightness(${0.9 + 0.2*avgL*flick*glowFade})`;
                        comingEl.style.opacity = String(0.86 + 0.08*avgL);
                    }
                    platformEls.forEach(function(btn, idx) {
                        // Light falling on this button: the frame strip above it.
                        const strip = strips[Math.min(idx, 2)] || strips[1];
                        const sN = strip[3] || 1;
                        const sR = strip[0]/sN, sG = strip[1]/sN, sB = strip[2]/sN;
                        const sL = (0.2126*sR + 0.7152*sG + 0.0722*sB)/255;
                        const isActive = btn.classList.contains('active');
                        // popped-out is very reactive — extension of glow, popped-in is muted
                        const b = isActive ? (0.68 + 0.18*avgL*flick) : (0.52 + 0.78*sL*flick*glowFade);
                        const tBlur = isActive ? '0px' : `${(2.8 + 5.5*sL*flick).toFixed(1)}px`;
                        const tAlpha = isActive ? '0' : (0.09 + 0.18*sL*flick*glowFade).toFixed(3);
                        btn.style.filter = `brightness(${b}) contrast(0.96)`;
                        btn.style.opacity = isActive ? String(0.80 + 0.08*avgL) : String(0.84 + 0.12*sL);
                        btn.style.setProperty('--btn-text-blur', tBlur);
                        btn.style.setProperty('--btn-text-alpha', tAlpha);
                        // specular only when popped-out — bright, always-visible edge
                        const spec = isActive ? 0 : Math.min(1, 0.65 + 0.9 * sL * flick * glowFade);
                        btn.style.setProperty('--btn-specular', String(spec.toFixed(3)));
                        // Kick-ass part: the shimmer carries the COLOR of the light
                        // above this button. Peak/mid/low stops get a subtle hue
                        // push from the strip average, capped so it stays glassy.
                        const maxC = Math.max(sR, sG, sB);
                        let mixT = 0;
                        if (maxC > 24) {
                            mixT = Math.min(0.45, (maxC / 255 - 0.09) * 0.8 * (0.3 + 0.7 * sL) * flick * (0.5 + 0.5 * glowFade));
                        }
                        const hueR = Math.min(255, Math.round(sR * 255 / Math.max(24, maxC)));
                        const hueG = Math.min(255, Math.round(sG * 255 / Math.max(24, maxC)));
                        const hueB = Math.min(255, Math.round(sB * 255 / Math.max(24, maxC)));
                        const pR = Math.round(60 + (hueR - 60) * mixT * 0.85);
                        const pG = Math.round(60 + (hueG - 60) * mixT * 0.85);
                        const pB = Math.round(60 + (hueB - 60) * mixT * 0.85);
                        const mR = Math.round(pR * 0.375), mG = Math.round(pG * 0.375), mB = Math.round(pB * 0.375);
                        const lR = Math.round(pR * 0.125), lG = Math.round(pG * 0.125), lB = Math.round(pB * 0.125);
                        btn.style.setProperty('--btn-spec-bg',
                            `radial-gradient(ellipse 26% 32% at var(--btn-spec-x, 22%) var(--btn-spec-y, 20%), color(srgb-linear ${pR} ${pG} ${pB}) 0%, color(srgb-linear ${mR} ${mG} ${mB}) 18%, color(srgb-linear ${lR} ${lG} ${lB}) 32%, transparent 62%)`);
                        // Neumorphic top edge takes the same light, softer.
                        btn.style.setProperty('--btn-edge',
                            `rgba(${Math.min(255, 212 + hueR * mixT * 0.3)}, ${Math.min(255, 212 + hueG * mixT * 0.3)}, ${Math.min(255, 217 + hueB * mixT * 0.3)}, ${(0.075 + 0.07 * sL).toFixed(3)})`);
                    });
                    // HDR shimmering edge: location + intensity from top edge, way brighter
                    if (bezelEl) {
                        let topR=0, topG=0, topB=0, topC=0;
                        const topY0 = 0, topY1 = Math.floor(h * 0.22);
                        for (let y=topY0; y<topY1; y++) {
                            for (let x=0; x<w; x++) {
                                const i=(y*w+x)*4;
                                topR+=lumaData[i]; topG+=lumaData[i+1]; topB+=lumaData[i+2]; topC++;
                            }
                        }
                        topR/=topC; topG/=topC; topB/=topC;
                        const topL = (0.2126*topR + 0.7152*topG + 0.0722*topB)/255;
                        const spec = Math.min(1, 0.72 + 0.68 * topL * flick * (0.45 + 0.55*glowFade));
                        bezelEl.style.setProperty('--bezel-specular', String(spec.toFixed(3)));
                        // real-time location: weighted centroid -> angle around border, so highlight crawls the edge
                        let sX=0,sY=0,wSum=0;
                        for (let y=0; y<h; y++) {
                            for (let x=0; x<w; x++) {
                                const i=(y*w+x)*4;
                                const lum = (0.2126*lumaData[i] + 0.7152*lumaData[i+1] + 0.0722*lumaData[i+2])/255;
                                const wgt = Math.pow(Math.max(0, lum - 0.22), 1.9) + 0.0005;
                                sX += (x/(w-1)) * wgt; sY += (y/(h-1)) * wgt; wSum += wgt;
                            }
                        }
                        const cX = wSum>0 ? sX/wSum : 0.22, cY = wSum>0 ? sY/wSum : 0.18;
                        const ang = Math.atan2(cY - 0.5, cX - 0.5);
                        // bezel: highlight on its border perimeter — pushed to edge so it's visible
                        const bR = 0.50;
                        bezelEl.style.setProperty('--bezel-x', (50 + Math.cos(ang) * bR * 50).toFixed(1) + '%');
                        bezelEl.style.setProperty('--bezel-y', (50 + Math.sin(ang) * bR * 44).toFixed(1) + '%');
                        // buttons: same angle but per-button phase so they don't lockstep, still on border
                        platformEls.forEach(function(btn, idx) {
                            const ph = (idx - 1) * 0.32;
                            const a = ang + ph;
                            const r = 0.50;
                            btn.style.setProperty('--btn-spec-x', (50 + Math.cos(a) * r * 50).toFixed(1) + '%');
                            btn.style.setProperty('--btn-spec-y', (50 + Math.sin(a) * r * 42).toFixed(1) + '%');
                        });
                    }
                }

                function renderGlow(now) {
                    if (!glowBroken) {
                        const playing = !skleshTrailer.paused && !skleshTrailer.ended;
                        if (playing && !document.hidden && glowInView &&
                            now - glowLastDraw >= 33) { // ~30 fps ceiling
                            glowLastDraw = now;
                            paintGlowFrame();
                        }
                    }
                    updateGlowOpacity(now, 0.025, 0.04);
                    updateTextLight();
                    if (dustActive && !document.hidden && glowInView &&
                        now - dustLastDraw >= 33) {
                        dustLastDraw = now;
                        renderDust(now);
                    }
                    requestAnimationFrame(renderGlow);
                }
                requestAnimationFrame(renderGlow);
            })();

            function showPlatformWidgets(platform) {
                const steamWidgets = document.querySelector('.steam-widgets');
                const itchWidgets = document.querySelector('.itch-widgets');
                
                // Reset all buttons
                platformButtons.forEach(btn => btn.classList.remove('active'));
                
                // Hide all widgets first
                steamWidgets.classList.remove('visible');
                itchWidgets.classList.remove('visible');
                widgetGroups.forEach(function(group) {
                    group.querySelectorAll('.embed-shell').forEach(function(shell) {
                        shell.classList.remove('embed-visible');
                    });
                });
                
                // Show selected platform widgets
                if (platform === 'steam') {
                    steamWidgets.classList.add('visible');
                    document.querySelector('[data-platform="steam"]').classList.add('active');
                    window.requestAnimationFrame(function() {
                        window.requestAnimationFrame(function() {
                            observeLazyEmbeds(steamWidgets);
                            revealReadyEmbeds(steamWidgets);
                        });
                    });
                } else if (platform === 'itch') {
                    itchWidgets.classList.add('visible');
                    document.querySelector('[data-platform="itch"]').classList.add('active');
                    window.requestAnimationFrame(function() {
                        window.requestAnimationFrame(function() {
                            observeLazyEmbeds(itchWidgets);
                            revealReadyEmbeds(itchWidgets);
                        });
                    });
                }
                
                // Show widgets container
                widgetsContainer.classList.add('visible');
            }

            // Add click event listeners to platform buttons
            platformButtons.forEach(button => {
                button.addEventListener('click', () => {
                    if (button.disabled) return;
                    showPlatformWidgets(button.dataset.platform);
                });
            });

            video.addEventListener('playing', markIntroPlaying, { once: true });
            video.addEventListener('loadedmetadata', startVideo, { once: true });

            video.addEventListener('ended', showContent);
            video.addEventListener('error', function() {
                if (!video.error || video.error.code !== 1) {
                    introState = 'fallback';
                    showContent();
                }
            });

            if (video.readyState >= HTMLMediaElement.HAVE_METADATA) {
                startVideo();
            }
        });
    </script>
</body>
</html>
