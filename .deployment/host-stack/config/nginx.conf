server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /data/root/current;
    index index.html;

    # Faster first load — gzip HTML/CSS/JS inline (158KB → ~34KB) without visual change
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_proxied any;
    gzip_types
        text/css
        text/plain
        text/xml
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/ttf
        font/woff
        font/woff2;
    gzip_static on;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location ~ (^|/)\. {
        return 404;
    }

    # HTML entry points — never cache, always revalidate for instant deploys
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires off;
    }

    # Versioned static embeds — immutable, long cache (busted via ?v= query)
    location ~ ^/assets/(itch-embeds|itch-thumbnails|itch-hdr)/ {
        expires off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # Fingerprinted assets — immutable for a year
    location ~* \.(?:avif|jpg|jpeg|png|gif|webp|svg|woff2|woff|ttf|otf|mp4|webm|js|css)$ {
        expires off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # Manifest / icons — short cache, revalidate
    location ~* ^/(site\.webmanifest|favicon.*\.png)$ {
        expires off;
        add_header Cache-Control "public, max-age=86400, must-revalidate" always;
    }

    location / {
        # Default for un-matched (e.g. /) — no-cache so html stays fresh
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri $uri/ =404;
    }
}
