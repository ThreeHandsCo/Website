<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
html,body{margin:0;padding:0;background:#000;color:#B8C0C8;font-family:'Press Start 2P',cursive;}
a{text-decoration:none}
.embed{display:flex;align-items:center;gap:16px;width:560px;height:175px;box-sizing:border-box;padding:12px;background:#000;border:0;overflow:hidden}
.thumb{width:170px;height:135px;flex:0 0 170px;background:#111 url('/assets/itch-thumbnails/4719904.jpg') center/cover no-repeat;border-radius:0;border:2px solid #B8C0C8}
.meta{flex:1;min-width:0}
.title{font-size:12px;line-height:1.4;color:#B8C0C8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:0.5px}
.link{display:inline-block;margin-top:14px;font-size:9px;letter-spacing:1px;padding:10px 14px;background:#B8C0C8;color:#000000;border:2px solid #B8C0C8;text-transform:uppercase}
.link:hover{filter:brightness(1.1)}
@media (max-width: 600px) {
  .embed{width:100vw;height:100vh;max-width:100%;max-height:100%;padding:14px;gap:12px}
  .thumb{width:38%;height:auto;aspect-ratio:1.26;flex:0 0 38%}
  .title{font-size:14px;white-space:normal;line-height:1.5}
  .link{font-size:10px;padding:12px 16px;margin-top:16px}
}
</style>
</head>
<body>
<div class="embed">
  <div class="thumb"></div>
  <div class="meta">
    <div class="title">TWISTER I BARELY KNOW HER</div>
    <a class="link" href="https://hxydn.itch.io/twister-i-barely-know-her" target="_blank" rel="noopener">VIEW ON ITCH.IO</a>
  </div>
</div>
</body>
</html>
