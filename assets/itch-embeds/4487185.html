<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
html { height:100%; background:#000; dynamic-range-limit:no-limit; }
body { margin:0; padding:0; height:100%; background:#000; color:#FFFFFF; font-family:'Press Start 2P',cursive; dynamic-range-limit:no-limit; }
a { text-decoration:none; }
.embed { display:grid; grid-template-columns:175px minmax(0,1fr); gap:18px; width:100%; height:100%; min-height:175px; box-sizing:border-box; padding:14px; background:#000; overflow:hidden; }
.thumb-frame { width:175px; height:138px; box-sizing:border-box; padding:2px; background:#FFFFFF; overflow:hidden; }
.thumb { width:100%; height:100%; background:#111 url('/assets/itch-thumbnails/4487185.jpg') center/cover no-repeat; }
.meta { min-width:0; min-height:0; height:100%; display:grid; grid-template-rows:auto auto; gap:10px; align-content:start; overflow:hidden; }
.title { min-height:0; overflow-wrap:anywhere; white-space:normal; font-size:14px; line-height:1.5; font-weight:700; letter-spacing:.5px; color:#FFFFFF; }
.link-frame { width:max-content; max-width:100%; box-sizing:border-box; padding:2px; background:#FFFFFF; }
.link { display:block; box-sizing:border-box; max-width:100%; padding:10px 14px; background:#FFFFFF; color:#000000; border:0; font-size:10px; line-height:1.4; letter-spacing:1px; text-align:center; text-transform:uppercase; white-space:normal; }
.link:hover { filter:brightness(1.15); }
/* Actual PQ/BT.2020 HDR swatches. Browsers that do not support HDR AVIF
   keep the generated SDR colors above; HDR-capable outputs tone-map this
   image correctly instead of clamping CSS color() values. */
@supports (background-image:url('/assets/itch-hdr/FFFFFF.avif')) {
  .thumb-frame { background-image:url('/assets/itch-hdr/FFFFFF.avif'); background-size:cover; background-repeat:no-repeat; background-position:center; }
}
@supports (background-image:url('/assets/itch-hdr/FFFFFF.avif')) {
  .link-frame, .link { background-image:url('/assets/itch-hdr/FFFFFF.avif'); background-size:cover; background-repeat:no-repeat; background-position:center; }
}
@supports ((-webkit-background-clip:text) or (background-clip:text)) and (background-image:url('/assets/itch-hdr/FFFFFF.avif')) {
  .title { color:transparent; -webkit-text-fill-color:transparent; background-image:url('/assets/itch-hdr/FFFFFF.avif'); background-repeat:repeat; background-size:auto 100%; -webkit-background-clip:text; background-clip:text; }
}
@media (max-width:600px) {
  .embed { grid-template-columns:38% minmax(0,1fr); gap:12px; min-height:100%; padding:12px; }
  .thumb-frame { width:100%; height:auto; aspect-ratio:1.27; }
  .title { font-size:14px; line-height:1.5; }
  .link-frame { width:100%; }
  .link { padding:10px 8px; font-size:10px; letter-spacing:.5px; }
}
</style>
</head>
<body>
<div class="embed">
  <div class="thumb-frame"><div class="thumb"></div></div>
  <div class="meta">
    <div class="title">FTROYL</div>
    <div class="link-frame"><a class="link" href="https://p3rv3rt.itch.io/ftroyl" target="_blank" rel="noopener">VIEW ON ITCH.IO</a></div>
  </div>
</div>
</body>
</html>
