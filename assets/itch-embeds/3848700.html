<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
html{background:#000;dynamic-range-limit:no-limit;}
body{margin:0;padding:0;background:#000;color:#F4D6A0;font-family:'Press Start 2P',cursive;dynamic-range-limit:no-limit;}
a{text-decoration:none}
.embed{display:flex;align-items:center;gap:18px;width:560px;height:175px;box-sizing:border-box;padding:14px;background:#000;border:0;overflow:hidden}
.thumb{width:175px;height:138px;flex:0 0 175px;background:#111 url('/assets/itch-thumbnails/3848700.jpg') center/cover no-repeat;border-radius:0;border:2px solid #F4D6A0}
.meta{flex:1;min-width:0}
.title{font-size:14px;line-height:1.5;color:#F4D6A0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:0.5px;font-weight:700}
.link{display:inline-block;margin-top:14px;font-size:10px;letter-spacing:1px;padding:10px 14px;background:#F4D6A0;color:#000000;border:2px solid #F4D6A0;text-transform:uppercase}
.link:hover{filter:brightness(1.15)}
/* HDR 2 stops — only on HDR displays, with proper linear conversion */
@media (dynamic-range: high) {
  @supports (color: color(display-p3 1 0 0)) {
    .title{color:color(display-p3 1.722 1.511 1.129);}
    .thumb{border-color:color(display-p3 1.722 1.511 1.129);}
    .link{background:color(display-p3 1.722 1.511 1.129);border-color:color(display-p3 1.722 1.511 1.129);}
  }
  @supports (color: color(srgb-linear 1 0 0)) {
    .title{color:color(srgb-linear 3.6186 2.6898 1.4061);}
    .thumb{border-color:color(srgb-linear 3.6186 2.6898 1.4061);}
    .link{background:color(srgb-linear 3.6186 2.6898 1.4061);border-color:color(srgb-linear 3.6186 2.6898 1.4061);}
  }
}
@media (max-width: 600px) {
  .embed{width:100vw;min-height:260px;height:auto;max-width:100%;padding:16px;gap:14px;flex-direction:column;align-items:stretch}
  .thumb{width:100%;height:160px;flex:0 0 auto;aspect-ratio:auto}
  .meta{width:100%}
  .title{font-size:16px;white-space:normal;line-height:1.6}
  .link{font-size:11px;padding:12px 16px;margin-top:18px;width:100%;box-sizing:border-box;text-align:center}
}
</style>
</head>
<body>
<div class="embed">
  <div class="thumb"></div>
  <div class="meta">
    <div class="title">:3iscuit's Bodega</div>
    <a class="link" href="https://hxydn.itch.io/3iscuitsbodega" target="_blank" rel="noopener">VIEW ON ITCH.IO</a>
  </div>
</div>
</body>
</html>
