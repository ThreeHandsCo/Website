<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
html{background:#000;dynamic-range-limit:no-limit;}
body{margin:0;padding:0;background:#000;color:#D6D22E;font-family:'Press Start 2P',cursive;dynamic-range-limit:no-limit;}
a{text-decoration:none}
.embed{display:flex;align-items:center;gap:18px;width:560px;height:175px;box-sizing:border-box;padding:14px;background:#000;border:0;overflow:hidden}
.thumb{width:175px;height:138px;flex:0 0 175px;background:#111 url('/assets/itch-thumbnails/3783549.jpg') center/cover no-repeat;border-radius:0;border:2px solid #D6D22E}
.meta{flex:1;min-width:0}
.title{font-size:14px;line-height:1.5;color:#D6D22E;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:0.5px;font-weight:700}
.link{display:inline-block;margin-top:14px;font-size:10px;letter-spacing:1px;padding:10px 14px;background:#D6D22E;color:#000000;border:2px solid #D6D22E;text-transform:uppercase}
.link:hover{filter:brightness(1.15)}
/* HDR 2 stops — only on HDR displays, with proper linear conversion */
@media (dynamic-range: high) {
  @supports (color: color(display-p3 1 0 0)) {
    .title{color:color(display-p3 1.511 1.482 0.325);}
    .thumb{border-color:color(display-p3 1.511 1.482 0.325);}
    .link{background:color(display-p3 1.511 1.482 0.325);border-color:color(display-p3 1.511 1.482 0.325);}
  }
  @supports (color: color(srgb-linear 1 0 0)) {
    .title{color:color(srgb-linear 2.6898 2.5779 0.1093);}
    .thumb{border-color:color(srgb-linear 2.6898 2.5779 0.1093);}
    .link{background:color(srgb-linear 2.6898 2.5779 0.1093);border-color:color(srgb-linear 2.6898 2.5779 0.1093);}
  }
}
@media (max-width: 600px) {
  .embed{width:100vw;height:100vh;max-width:100%;max-height:100%;padding:16px;gap:14px}
  .thumb{width:40%;height:auto;aspect-ratio:1.27;flex:0 0 40%}
  .title{font-size:16px;white-space:normal;line-height:1.6}
  .link{font-size:11px;padding:12px 16px;margin-top:18px}
}
</style>
</head>
<body>
<div class="embed">
  <div class="thumb"></div>
  <div class="meta">
    <div class="title">Lou's Ordinary Life</div>
    <a class="link" href="https://ooglewoogleblpbhbh.itch.io/lous-ordinary-life" target="_blank" rel="noopener">VIEW ON ITCH.IO</a>
  </div>
</div>
</body>
</html>
