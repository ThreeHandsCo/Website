<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
html { height:100%; background:transparent; dynamic-range-limit:no-limit; }
body { margin:0; padding:0; height:100%; background:transparent; color:#545454; font-family:'Press Start 2P',cursive; dynamic-range-limit:no-limit; }
a { text-decoration:none; }
.embed { display:grid; grid-template-columns:175px minmax(0,1fr); gap:18px; width:100%; height:100%; min-height:175px; box-sizing:border-box; align-items:start; padding:14px; background:transparent; overflow:hidden; }
.thumb-frame { position:relative; width:175px; height:138px; box-sizing:border-box; background:#545454; overflow:hidden; }
.thumb { position:absolute; inset:2px; background:transparent url('/assets/itch-thumbnails/4244245.jpg') center/cover no-repeat; }
.meta { min-width:0; min-height:0; width:100%; height:138px; align-self:start; display:flex; flex-direction:column; gap:10px; overflow:hidden; }
.title { flex:1 1 auto; min-width:0; min-height:0; overflow:hidden; overflow-wrap:normal; word-break:normal; hyphens:none; white-space:normal; font-size:14px; line-height:1.15; font-weight:700; letter-spacing:.5px; color:#545454; }
.link-frame { flex:0 0 auto; width:max-content; max-width:100%; box-sizing:border-box; margin-top:auto; padding:2px; background:#545454; }
.link { display:block; box-sizing:border-box; max-width:100%; padding:10px 14px; background:#545454; color:#000000; border:0; font-size:10px; line-height:1.4; letter-spacing:1px; text-align:center; text-transform:uppercase; white-space:normal; }
.link:hover { filter:brightness(1.15); }
/* Actual PQ/BT.2020 HDR swatches. Browsers that do not support HDR AVIF
   keep the generated SDR colors above; HDR-capable outputs tone-map this
   image correctly instead of clamping CSS color() values. */
@supports (background-image:url('/assets/itch-hdr/545454.avif')) {
  .thumb-frame { background-image:url('/assets/itch-hdr/545454.avif'); background-size:cover; background-repeat:no-repeat; background-position:center; }
}
@supports (background-image:url('/assets/itch-hdr/545454.avif')) {
  .link-frame, .link { background-image:url('/assets/itch-hdr/545454.avif'); background-size:cover; background-repeat:no-repeat; background-position:center; }
}
@supports ((-webkit-background-clip:text) or (background-clip:text)) and (background-image:url('/assets/itch-hdr/545454.avif')) {
  .title { color:transparent; -webkit-text-fill-color:transparent; background-image:url('/assets/itch-hdr/545454.avif'); background-repeat:repeat; background-size:auto 100%; -webkit-background-clip:text; background-clip:text; }
}
@media (max-width:600px) {
  .embed { grid-template-columns:38% minmax(0,1fr); gap:12px; min-height:100%; padding:12px; }
  .thumb-frame { width:100%; height:auto; aspect-ratio:1.27; }
  .link-frame { width:100%; }
  .link { padding:10px 8px; font-size:10px; letter-spacing:.5px; }
}
</style>
</head>
<body>
<div class="embed">
  <div class="thumb-frame"><div class="thumb"></div></div>
  <div class="meta">
    <div class="title">I Got Reincarnated As A Chud And I Can Level Up To A Chad!</div>
    <div class="link-frame"><a class="link" href="https://ooglewoogleblpbhbh.itch.io/i-got-reincarnated-as-a-chud-and-i-can-level-up-to-a-chad" target="_blank" rel="noopener">VIEW ON ITCH.IO</a></div>
  </div>
</div>
<script>
(() => {
  const embed = document.querySelector('.embed');
  const thumbFrame = document.querySelector('.thumb-frame');
  const meta = document.querySelector('.meta');
  const title = document.querySelector('.title');
  const linkFrame = document.querySelector('.link-frame');
  if (!embed || !thumbFrame || !meta || !title) return;

  const MIN_FONT_SIZE = 7;
  const MAX_FONT_SIZE = 48;

  function titleFits(size) {
    title.style.fontSize = `${size}px`;
    // Strict: a 1px tolerance lets the bottom pixel row of a pixel font clip.
    return title.scrollWidth <= title.clientWidth + 0.5
      && title.scrollHeight <= title.clientHeight + 0.5;
  }

  function fitTitle() {
    if (!title.clientWidth || !title.clientHeight) return;
    let low = MIN_FONT_SIZE;
    let high = MAX_FONT_SIZE;
    let best = MIN_FONT_SIZE;
    while (high - low > 0.1) {
      const middle = (low + high) / 2;
      if (titleFits(middle)) {
        best = middle;
        low = middle;
      } else {
        high = middle;
      }
    }
    title.style.fontSize = `${best}px`;
  }

  function syncEmbedLayout() {
    // The thumb column can be taller than the iframe (mobile breakpoint fires
    // for scaled-down desktop iframes too). Clamp meta so thumb + gap + button
    // always fit inside the embed box, or the button and title get clipped.
    const thumbH = thumbFrame.getBoundingClientRect().height;
    const embedH = embed.getBoundingClientRect().height;
    const embedStyle = getComputedStyle(embed);
    const pad = (parseFloat(embedStyle.paddingTop) || 0) + (parseFloat(embedStyle.paddingBottom) || 0);
    const gap = (parseFloat(getComputedStyle(meta).rowGap) || 0);
    const linkH = linkFrame ? linkFrame.getBoundingClientRect().height : 0;
    const metaH = Math.min(thumbH, embedH - pad - gap - linkH);
    if (thumbH > 0 && metaH > 0) meta.style.height = `${metaH}px`;
    fitTitle();
  }

  if ('ResizeObserver' in window) {
    const observer = new ResizeObserver(syncEmbedLayout);
    observer.observe(embed);
    observer.observe(thumbFrame);
  }
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(syncEmbedLayout);
  window.addEventListener('load', syncEmbedLayout, { once: true });
  syncEmbedLayout();
})();
</script>
</body>
</html>
