name: Deploy fallback origin

# Publishes the site to GitHub Pages as an independent second origin
# (www.threehands.dev). The primary origin is the home server via Tailscale
# Funnel; the mask page fails over here when the primary is unreachable.
# Both origins deploy from the same commit, so they cannot drift.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: fallback-origin-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://www.threehands.dev/
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Gather site files
        run: |
          mkdir -p /tmp/site
          rsync -a \
            --exclude '.git' \
            --exclude '.build' \
            --exclude '.deployment' \
            --exclude '.github' \
            --exclude '__pycache__' \
            --exclude 'itch-proxy.py' \
            --exclude 'README.md' \
            ./ /tmp/site/

      # The site uses root-absolute paths (/assets/...) which only work on a
      # domain root. The Pages fallback lives at threehandsco.github.io/Website/,
      # so rewrite every root-absolute reference to carry the /Website prefix.
      # Two patterns cover all occurrences: attribute quotes (="/) and
      # paren-single-quote (url('/..., new URL('/...).
      - name: Rewrite root-absolute paths for the /Website base
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path('/tmp/site')
          touched = 0
          for p in root.rglob('*'):
              if p.is_file() and p.suffix.lower() in ('.html', '.js', '.css', '.webmanifest', '.json', '.svg'):
                  text = p.read_text(encoding='utf-8')
                  rewritten = text.replace('="/', '="/Website/').replace("('/", "('/Website/")
                  if rewritten != text:
                      p.write_text(rewritten, encoding='utf-8')
                      touched += 1
          print(f'rewrote paths in {touched} files')
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/site

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
